<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<title>Mes Recettes — Calendrier &amp; Courses</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THÈME « CAHIER À PETITS CARREAUX »
     papier crème quadrillé, encre bleue, surligneur jaune,
     marge rouge, titres manuscrits
     ============================================================ */
  :root{
    --paper:#F8F5EE;          /* fond de la page */
    --paper-2:#EFEADF;        /* papier un peu plus foncé (champs, code) */
    --sheet:#FFFDF8;          /* feuilles posées sur la page (cartes) */
    --past:#E6E1D5;           /* jours passés : papier plus sombre */
    --ink:#27324A;            /* texte : encre foncée */
    --ink-soft:#6B7386;       /* texte secondaire : crayon */
    --accent:#2F5DA8;         /* stylo bleu */
    --accent-deep:#224A8C;
    --accent-soft:#E7EDF7;
    --red:#C9534C;            /* stylo rouge / marge */
    --hl:#FFE680;             /* surligneur jaune */
    --hl-soft:#FFF6C9;        /* post-it */
    --hl-line:#EEDC8E;
    --line:#DDD6C7;           /* traits au crayon */
    --grid-c:rgba(47,93,168,.075);
    --grid:linear-gradient(var(--grid-c) 1px, transparent 1px),
           linear-gradient(90deg, var(--grid-c) 1px, transparent 1px);
    --grid-size:22px 22px;
    --shadow:0 1px 2px rgba(39,50,74,.06), 0 3px 10px rgba(39,50,74,.07);
    --radius:6px;
    --hand:"Caveat","Noteworthy","Segoe Print","Comic Sans MS",cursive;
    --safe:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background-color:var(--paper);
    background-image:var(--grid);
    background-size:var(--grid-size);
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;font-size:inherit;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}

  /* ---------- Header : haut de page avec la double marge rouge ---------- */
  header.app{
    position:sticky;top:0;z-index:20;
    background:var(--sheet);
    border-bottom:3px double rgba(201,83,76,.55);
    padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .brand{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .brand .dot{
    width:30px;height:30px;flex:none;border-radius:50%;background:var(--hl);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transform:rotate(-8deg);
  }
  .brand .dot::before{content:"✎";color:var(--accent-deep)}
  .brand h1{font-family:var(--hand);font-size:30px;line-height:1;margin:0;font-weight:700;color:var(--accent-deep)}
  .brand small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Nav ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;background:rgba(255,253,248,.95);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe);
  }
  nav.tabs button{
    flex:1;border:0;background:none;padding:8px 4px 7px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-family:var(--hand);font-size:18px;line-height:1;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:color .15s;position:relative;
  }
  nav.tabs button svg{width:22px;height:22px;stroke-width:1.7}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button.on svg{stroke:var(--accent)}
  nav.tabs button.on::after{          /* coup de surligneur sous l'onglet actif */
    content:"";position:absolute;left:30%;right:30%;bottom:5px;height:7px;
    background:var(--hl);opacity:.75;border-radius:4px;z-index:-1;
  }

  main{padding:16px 14px calc(96px + var(--safe));max-width:640px;margin:0 auto}
  .view{display:none}
  .view.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* ---------- Cartes : feuilles quadrillées posées sur la page ---------- */
  .card{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  h2.sec{
    font-family:var(--hand);font-size:26px;line-height:1.1;margin:0 0 10px;font-weight:700;color:var(--accent-deep);
    display:inline-block;background:linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%);
    padding:0 4px;
  }
  .muted{color:var(--ink-soft);font-size:13.5px}
  .empty{
    text-align:center;color:var(--ink-soft);font-size:14px;
    padding:26px 14px;border:1.5px dashed var(--line);border-radius:var(--radius);background:rgba(255,253,248,.7);
  }

  /* ---------- Boutons : encre bleue ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:0;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:700;
    background:var(--accent);color:#fff;cursor:pointer;transition:transform .08s,background .15s;
    box-shadow:0 2px 0 var(--accent-deep);
  }
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-deep)}
  .btn:disabled{opacity:.6}
  .btn.block{width:100%}
  .btn.ghost{background:var(--accent-soft);color:var(--accent-deep);box-shadow:none}
  .btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);box-shadow:none}
  .btn.sm{padding:8px 12px;font-size:13.5px;border-radius:7px}
  .btn.danger{background:var(--sheet);color:var(--red);border:1.5px solid rgba(201,83,76,.35);box-shadow:none}
  .row{display:flex;gap:9px;align-items:center}
  .row.wrap{flex-wrap:wrap}

  /* ---------- Semaine ---------- */
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .weeknav .lab{text-align:center;flex:1;min-width:0}
  .weeknav .lab b{display:block;font-family:var(--hand);font-size:30px;line-height:1;font-weight:700;color:var(--accent-deep)}
  .weeknav .lab span{font-size:12px;color:var(--ink-soft);font-weight:600}
  .iconbtn{
    width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);
    background:var(--sheet);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{background:var(--accent-soft)}
  .iconbtn svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Jours ---------- */
  .day{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);
    border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);
    scroll-margin-top:calc(98px + env(safe-area-inset-top,0px));   /* ne passe pas sous l'en-tête */
  }
  .day-h{
    display:flex;align-items:baseline;gap:8px;padding:8px 13px 4px;
    border-bottom:1.5px solid rgba(201,83,76,.4);           /* trait de marge rouge */
  }
  .day-h .dname{font-family:var(--hand);font-size:26px;line-height:1;font-weight:700;flex:1;color:var(--ink)}
  .day-h .dnum{font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .badge{
    font-family:var(--hand);font-size:19px;line-height:1;font-weight:700;color:var(--ink);
    background:var(--hl);border-radius:3px;padding:1px 7px 2px;transform:rotate(-2deg);
  }
  /* aujourd'hui : cadre au stylo bleu + nom surligné */
  .day.today{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft), var(--shadow)}
  .day.today .dname{color:var(--accent-deep)}
  /* jours passés : papier plus sombre, contenu estompé */
  .day.past{background-color:var(--past);box-shadow:none;border-color:#D3CCBC}
  .day.past .day-h{border-bottom-color:rgba(107,115,134,.3)}
  .day.past .dname,.day.past .dnum{color:#8A8F9C}
  .day.past .chip{background:rgba(255,255,255,.45);border-color:#D3CCBC;box-shadow:none}
  .day.past .chip .nm{color:#646B7A}
  .day.past .addmini{background:transparent;color:#8A8F9C;border-color:#CFC8B8}
  .day.past .whobtn,.day.past .tag{opacity:.75}
  .day.past .whobtn{border-color:#CFC8B8}
  .day.past .slot-t{color:#9A8F8C}

  .slots{padding:8px 11px 6px}
  .slot{margin-bottom:7px}
  .slot:last-child{margin-bottom:3px}
  .slot-t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--red);margin:2px 0 5px 2px;font-weight:800}
  /* un plat = un post-it */
  .chip{
    display:flex;align-items:center;gap:8px;background:var(--hl-soft);
    border:1px solid var(--hl-line);border-radius:3px;padding:8px 10px;margin-bottom:6px;
    box-shadow:0 1px 2px rgba(120,100,30,.12);
  }
  .chip .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
  .chip .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .tag{
    display:inline-block;font-size:10.5px;background:transparent;color:var(--accent-deep);
    border:1px solid rgba(47,93,168,.35);border-radius:10px;padding:0 7px;font-weight:700;
  }
  .x{
    border:0;background:transparent;color:var(--ink-soft);cursor:pointer;
    width:28px;height:28px;flex:none;border-radius:6px;font-size:17px;line-height:1;
  }
  .x:active{background:rgba(0,0,0,.05)}
  .addmini{
    width:100%;border:1.5px dashed var(--line);background:rgba(255,253,248,.6);border-radius:6px;
    padding:7px;font-family:var(--hand);font-size:19px;line-height:1.1;color:var(--accent);font-weight:700;cursor:pointer;margin-bottom:6px;
  }

  /* ---------- Recettes ---------- */
  .rlist{display:flex;flex-direction:column;gap:10px}
  .rec{
    background:var(--sheet);border:1px solid var(--line);border-left:3px solid rgba(201,83,76,.55);
    border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;
  }
  .rec:active{background:var(--paper-2)}
  .rec h3{margin:0 0 3px;font-family:var(--hand);font-size:25px;line-height:1.1;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
  .rec .meta{font-size:12.5px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
  .rec .ing{margin-top:7px;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}

  /* ---------- Formulaires : lignes à remplir ---------- */
  label.f{display:block;font-size:12px;font-weight:800;color:var(--red);margin:12px 0 5px;letter-spacing:.6px;text-transform:uppercase}
  label.f:first-child{margin-top:0}
  input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;
    background:var(--sheet);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .grid2{display:grid;grid-template-columns:1fr 96px;gap:8px}
  .ingline{display:grid;grid-template-columns:1fr 60px 82px 32px;gap:6px;margin-bottom:7px;align-items:center}
  .ingline input[type=number]{padding:10px 8px;text-align:center}
  .ingline select{padding:10px 4px;text-align:center}
  .ingline .x{width:32px;height:32px}
  .tagbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tagpick{
    border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;
    padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:700;color:var(--ink-soft);
  }
  .tagpick.on{background:var(--hl);border-color:var(--hl-line);color:var(--ink)}
  .tagpick .cnt{opacity:.65;font-weight:600}

  /* ---------- Recherche ---------- */
  .searchwrap{position:relative;margin-bottom:12px}
  .searchwrap input{padding-left:36px}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-soft);fill:none;stroke-width:2}

  /* ---------- Fenêtres : une feuille qui monte ---------- */
  .modal{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(39,50,74,.38);backdrop-filter:blur(2px);
    align-items:flex-end;justify-content:center;
  }
  .modal.on{display:flex}
  .sheet{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);
    width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
    border-radius:14px 14px 0 0;padding:8px 16px calc(22px + var(--safe));
    border-top:3px double rgba(201,83,76,.55);
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
  .sheet h2{margin:0 0 12px;font-family:var(--hand);font-size:32px;line-height:1.05;font-weight:700;color:var(--accent-deep)}
  .sheet .foot{display:flex;gap:9px;margin-top:18px}
  .sheet .foot .btn{flex:1}

  /* ---------- Courses : liste cochée ---------- */
  .shopitem{
    display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);
  }
  .shopitem:last-child{border-bottom:0}
  .ck{
    width:24px;height:24px;flex:none;border-radius:4px;border:2px solid var(--ink-soft);
    background:var(--sheet);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .ck.on{background:transparent;border-color:var(--accent)}
  .ck svg{width:17px;height:17px;stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
  .ck.on svg{display:block}
  .shopitem .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
  .shopitem .txt small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400}
  .shopitem.done .txt{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--ink-soft)}
  .ingrow{display:flex;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:14px}
  .ingrow:last-child{border-bottom:0}
  .ingrow .q{font-weight:800;color:var(--accent-deep);white-space:nowrap}

  /* ---------- Divers ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translate(-50%,14px);
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center;
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
    border-radius:12px;padding:3px 9px;background:var(--accent-soft);color:var(--accent-deep);
  }
  .pill.cloud{background:#E4F1E6;color:#3F7049}
  .pill.local{background:#FBF0DD;color:#8E6A2E}
  .whobtn{
    width:100%;text-align:left;border:1.5px dashed var(--hl-line);background:transparent;
    border-radius:4px;padding:4px 9px;font-size:11.5px;color:var(--ink-soft);font-weight:700;cursor:pointer;
    margin-top:5px;
  }
  .whobtn.set{border-style:solid;border-color:rgba(47,93,168,.3);background:rgba(255,255,255,.6);color:var(--accent-deep)}
  .whopill{
    display:inline-block;font-size:10.5px;font-weight:800;background:var(--accent);color:#fff;
    border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:1px;
  }
  .acct{
    display:flex;align-items:center;gap:6px;flex:none;max-width:46%;
    border:1px solid var(--line);background:var(--sheet);border-radius:16px;
    padding:6px 11px;font-size:12px;font-weight:800;color:var(--accent-deep);cursor:pointer;
  }
  .acct[hidden]{display:none}
  .acct svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct.off{color:#8E6A2E;background:#FBF0DD;border-color:#EEDDBF}
  input.code{letter-spacing:6px;text-align:center;font-size:22px;font-weight:800}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:1em;font-weight:600}
  details.help summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--accent);padding:4px 0}
  details.help code{font-size:12px;background:var(--paper-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
  details.help pre{background:var(--paper-2);padding:10px;border-radius:6px;overflow-x:auto;font-size:11.5px;line-height:1.5}
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <span class="dot"></span>
    <div style="flex:1;min-width:0">
      <h1>Mes Recettes</h1>
      <small>Calendrier · Catalogue · Liste de courses</small>
    </div>
    <button class="acct" id="acctBtn" hidden aria-label="Mon compte et mon foyer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span id="acctLab">Connexion</span>
    </button>
  </div>
</header>

<main>

  <!-- ================= CALENDRIER ================= -->
  <section class="view on" id="v-cal">
    <div class="card">
      <div class="weeknav">
        <button class="iconbtn" id="prevW" aria-label="Semaine précédente">
          <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <div class="lab">
          <b id="wLabel">Semaine —</b>
          <span id="wRange"></span>
        </div>
        <button class="iconbtn" id="nextW" aria-label="Semaine suivante">
          <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
        </button>
      </div>
      <div class="row">
        <button class="btn ghost sm" id="todayBtn">Cette semaine</button>
        <button class="btn ghost sm" id="pickWeekBtn">Choisir</button>
        <button class="btn ghost sm" id="eatersBtn">Pour qui ?</button>
        <span style="flex:1"></span>
        <span class="pill" id="wCount">0 plat</span>
      </div>
    </div>

    <div id="weekDays"></div>

    <button class="btn block" id="weekToCart" style="margin-bottom:14px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6 5 3H2"/></svg>
      Liste de courses de cette semaine
    </button>
  </section>

  <!-- ================= RECETTES ================= -->
  <section class="view" id="v-rec">
    <button class="btn block" id="newRec" style="margin-bottom:14px">+ Nouvelle recette</button>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="search" id="qRec" placeholder="Rechercher une recette…">
    </div>
    <div class="tagbox" id="recTags" style="margin-bottom:14px"></div>
    <div class="rlist" id="recList"></div>
  </section>

  <!-- ================= COURSES ================= -->
  <section class="view" id="v-shop">
    <div class="card">
      <div class="row" style="gap:8px">
        <input type="text" id="newItem" placeholder="Ajouter un produit…" autocomplete="off">
        <button class="btn sm" id="addItem" style="flex:none">Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">Import depuis le calendrier</h2>
      <label class="f">Semaine</label>
      <div class="row">
        <button class="iconbtn" id="prevW2" aria-label="Semaine précédente">
          <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
        </button>
        <select id="impWeek" style="flex:1"></select>
        <button class="iconbtn" id="nextW2" aria-label="Semaine suivante">
          <svg viewBox="0 0 24 24"><polyline points="9 5 16 12 9 19"/></svg>
        </button>
      </div>
      <div id="impPreview" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 class="sec" style="margin:0">Ma liste</h2>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ============================================================
   DONNÉES
   ============================================================ */
const LS = 'mesrecettes.v1';

const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const SLOTS = [{k:'midi',l:'Midi'},{k:'soir',l:'Soir'}];

/* unités de mesure proposées dans le formulaire de recette */
const UNITS = [
  {k:'g',   l:'g'},
  {k:'kg',  l:'kg'},
  {k:'mg',  l:'mg'},
  {k:'ml',  l:'ml'},
  {k:'cl',  l:'cl'},
  {k:'l',   l:'L'},
  {k:'cc',  l:'c. à c.'},
  {k:'cs',  l:'c. à s.'},
  {k:'pcs', l:'pièce'},
  {k:'tranche', l:'tranche'},
  {k:'gousse',  l:'gousse'},
  {k:'pincee',  l:'pincée'},
  {k:'sachet',  l:'sachet'},
  {k:'boite',   l:'boîte'},
  {k:'botte',   l:'botte'},
  {k:'',    l:'—'}          // aucune unité (ex. « 2 œufs »)
];

/* libellé complet d'une quantité : « 200 g », « 3 pièces », « 2 » */
function qtyLabel(q, u){
  const val = (q === '' || q === null || q === undefined || isNaN(q)) ? '' : q;
  const unit = UNITS.find(x=>x.k === (u||''));
  const short = !u || u === 'pcs' ? '' : (unit ? unit.l : u);
  return [val, short].filter(Boolean).join(' ');
}

let state = { recipes:[], plan:{}, shopping:[], eaters:[] };

/* ---------- petites utilitaires ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2000);
}
function fmtDate(d){
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
/* --- date ISO locale (pas de décalage UTC) --- */
function isoOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* --- numéro de semaine ISO 8601 --- */
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return { week: Math.ceil((((d - y0)/86400000)+1)/7), year: d.getUTCFullYear() };
}
/* --- lundi de la semaine ISO "week" de l'année "year" --- */
function mondayOfWeek(year, week){
  const jan4 = new Date(year, 0, 4);
  const dow = (jan4.getDay() || 7);
  const mon = new Date(year, 0, 4 - dow + 1);
  mon.setDate(mon.getDate() + (week - 1) * 7);
  mon.setHours(0,0,0,0);
  return mon;
}
/* --- nombre de semaines ISO d'une année (52 ou 53, ex. 2026 en a 53) --- */
function weeksInYear(year){
  return isoWeek(new Date(year, 11, 28)).week;
}
function addDays(d, n){
  const x = new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x;
}
function weekDates(anchor){                    // 7 dates, lundi -> dimanche
  const { week, year } = isoWeek(anchor);
  const mon = mondayOfWeek(year, week);
  return DAYS.map((_,i)=> addDays(mon, i));
}
function grouped(arr, fn){                     // regroupe une liste par clé
  const m = {}; for (const x of arr){ const k = fn(x); (m[k] = m[k] || []).push(x); } return m;
}
let ANCHOR = new Date(); ANCHOR.setHours(0,0,0,0);

/* ---------- stockage : local + Supabase (optionnel) ---------- */
const store = {
  local(){
    try{ state = JSON.parse(localStorage.getItem(LS)) || { recipes:[], plan:{}, shopping:[], eaters:[] }; }
    catch(e){ state = { recipes:[], plan:{}, shopping:[], eaters:[] }; }
    state.recipes  = state.recipes  || [];
    state.plan     = state.plan     || {};
    state.shopping = state.shopping || [];
    state.eaters   = state.eaters   || [];
  },
  saveLocal(){ localStorage.setItem(LS, JSON.stringify(state)); },
  save(){
    this.saveLocal();
    if (cloud.on) cloud.put();
    else if (auth.session) cloud.pending = true;     // hors ligne : à envoyer au retour du réseau
  }
};

/* ============================================================
   SYNCHRONISATION MULTI-APPAREILS (Supabase — optionnel)
   ------------------------------------------------------------
   Les identifiants sont dans config.js. Chaque personne se
   connecte avec son e-mail (lien reçu par mail, ou code), puis
   partage les données des « foyers » dont elle est membre.
   Si config.js est vide, l'app fonctionne en local uniquement.
   ============================================================ */
const cfg = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG : {};
const SUPABASE_URL = (cfg.SUPABASE_URL || '').replace(/\/+$/,'');
const SUPABASE_KEY = cfg.SUPABASE_KEY || '';
const PREF_FOYER   = cfg.ROOM || '';            // foyer choisi par défaut si on est membre de plusieurs
const CLOUD_OK     = !!(SUPABASE_URL && SUPABASE_KEY);
const LS_SESSION   = 'mesrecettes.session';
const LS_FOYER     = 'mesrecettes.foyer';
const LS_LOCALONLY = 'mesrecettes.localonly';

/* ---------- connexion (API Supabase Auth, sans librairie externe) ---------- */
const auth = {
  session: null, _refreshing: null,
  load(){
    try{ this.session = JSON.parse(localStorage.getItem(LS_SESSION)); }catch(e){ this.session = null; }
  },
  save(s){
    this.session = s ? {
      access_token:  s.access_token,
      refresh_token: s.refresh_token,
      expires_at:    Number(s.expires_at) || (Math.floor(Date.now()/1000) + (Number(s.expires_in) || 3600)),
      email:         String((s.user && s.user.email) || s.email || '').toLowerCase()
    } : null;
    if(this.session) localStorage.setItem(LS_SESSION, JSON.stringify(this.session));
    else localStorage.removeItem(LS_SESSION);
  },
  get email(){ return this.session ? this.session.email : ''; },
  async call(path, body, token){
    const r = await fetch(SUPABASE_URL + '/auth/v1/' + path, {
      method: 'POST',
      headers: Object.assign({ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, token ? { Authorization:'Bearer '+token } : {}),
      body: JSON.stringify(body || {})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(j.msg || j.error_description || j.message || ('HTTP '+r.status)), { status:r.status });
    return j;
  },
  /* envoie l'e-mail contenant le lien (et le code, si le modèle d'e-mail l'inclut) */
  sendCode(email){
    const back = location.origin + location.pathname;
    return this.call('otp?redirect_to=' + encodeURIComponent(back), { email, create_user:true });
  },
  async verify(email, token){
    const s = await this.call('verify', { type:'email', email, token });
    s.email = email; this.save(s); return s;
  },
  /* retour depuis le lien de l'e-mail : l'adresse contient #access_token=…&refresh_token=… */
  async fromUrl(){
    const h = new URLSearchParams(location.hash.slice(1));
    const q = new URLSearchParams(location.search);
    const clean = () => history.replaceState(null, '', location.pathname);
    /* lien expiré ou déjà utilisé : Supabase renvoie l'erreur dans l'adresse (#… ou ?…) */
    const err = h.get('error_description') || h.get('error') || q.get('error_description') || q.get('error');
    if(err){ clean(); throw new Error(err); }
    if(!h.get('access_token')) return false;
    clean();
    const s = { access_token:h.get('access_token'), refresh_token:h.get('refresh_token'),
                expires_in:h.get('expires_in'), expires_at:h.get('expires_at') };
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+s.access_token } });
    if(!r.ok) throw new Error('Lien invalide');
    s.user = await r.json();
    this.save(s); return true;
  },
  /* jeton valide (rafraîchi automatiquement quand il expire) */
  async token(){
    if(!this.session) return null;
    if(this.session.expires_at - 60 > Date.now()/1000) return this.session.access_token;
    if(!this._refreshing){
      const email = this.email;
      this._refreshing = this.call('token?grant_type=refresh_token', { refresh_token:this.session.refresh_token })
        .then(s => { s.email = email; this.save(s); })
        .catch(e => { if(e.status >= 400 && e.status < 500) this.save(null); throw e; })   // session révoquée
        .finally(() => { this._refreshing = null; });
    }
    await this._refreshing;
    return this.session && this.session.access_token;
  },
  async logout(){
    const t = this.session && this.session.access_token;
    this.save(null);
    if(t){ try{ await this.call('logout', {}, t); }catch(e){} }
  }
};

/* ---------- accès à la base avec le jeton de la personne connectée ---------- */
async function db(path, opts = {}){
  const t = await auth.token();
  if(!t) throw Object.assign(new Error('Non connecté'), { status:401 });
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({ apikey:SUPABASE_KEY, Authorization:'Bearer '+t, 'Content-Type':'application/json' }, opts.headers || {})
  }));
  if(!r.ok){
    const j = await r.json().catch(()=>({}));
    throw Object.assign(new Error(j.message || ('HTTP '+r.status)), { status:r.status, code:j.code });
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

/* ---------- données partagées du foyer ---------- */
const cloud = {
  on:false, foyer:'', foyers:[], timer:null, pending:false, warned:false,
  async pull(){
    const rows = await db('recettes_app?select=data&id=eq.' + encodeURIComponent(this.foyer));
    if(rows && rows.length && rows[0].data){
      state = Object.assign({ recipes:[], plan:{}, shopping:[], eaters:[] }, rows[0].data);
      migrer();
      store.saveLocal();
      render();
    } else if(!(await this.flush())){       // foyer tout neuf : on y publie les données de cet appareil
      throw new Error('Envoi impossible');
    }
  },
  put(){
    clearTimeout(this.timer);
    this.pending = true;
    this.timer = setTimeout(()=> this.flush(), 700);
  },
  async flush(){
    clearTimeout(this.timer);
    if(!this.foyer) return false;
    try{
      await db('recettes_app', {
        method: 'POST',
        headers: { Prefer:'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ id:this.foyer, data:state, updated_at:new Date().toISOString() }])
      });
      this.pending = false; this.warned = false;
      return true;
    }catch(e){
      /* hors ligne : l'état local reste valable, on renverra à la prochaine occasion */
      if(!this.warned){ this.warned = true; toast('Envoi vers le cloud impossible — modifications gardées en local'); }
      return false;
    }
  },
  /* trouve le(s) foyer(s) de la personne connectée, puis charge les données */
  async start(){
    this.on = false;
    if(!auth.session){ paintAccount(); renderWeek(); return; }
    try{
      const rows = await db('foyer_membres?select=foyer_id&email=eq.' + encodeURIComponent(auth.email));
      this.foyers = Array.from(new Set((rows || []).map(r => r.foyer_id))).sort((a,b)=>a.localeCompare(b,'fr'));
      const saved = localStorage.getItem(LS_FOYER);
      const next = [saved, PREF_FOYER].find(f => f && this.foyers.includes(f)) || this.foyers[0] || '';
      const sameFoyer = next && next === this.foyer;
      this.foyer = next;
      if(!this.foyer){ paintAccount(); renderWeek(); openFoyer(); return; }
      localStorage.setItem(LS_FOYER, this.foyer);
      /* modifs faites hors ligne sur ce même foyer : on les envoie plutôt que de les écraser */
      if(this.pending && sameFoyer){ if(!(await this.flush())) throw new Error('Hors ligne'); }
      else { this.pending = false; await this.pull(); }
      this.on = true;
    }catch(e){
      if(!auth.session){ toast('Session expirée — reconnecte-toi'); openLogin(); }
      else toast('Synchronisation indisponible — données enregistrées localement');
    }
    paintAccount(); renderWeek();
  }
};

async function initCloud(){
  if(!CLOUD_OK) return;                         // pas de Supabase configuré : 100 % local
  $('#acctBtn').hidden = false;
  auth.load();
  let linkErr = '';
  try{
    if(await auth.fromUrl()){ localStorage.removeItem(LS_LOCALONLY); toast('Connecté·e'); }
  }catch(e){
    linkErr = 'Ce lien de connexion est invalide, expiré ou a déjà servi. Demande un nouveau lien ci-dessous.';
  }
  if(auth.session) await cloud.start();
  else{
    paintAccount();
    if(linkErr || localStorage.getItem(LS_LOCALONLY) !== '1') openLogin('', linkErr);
  }
  /* retour sur l'app (autre onglet, téléphone déverrouillé…) : on envoie nos
     modifs en attente, puis on récupère celles des autres membres du foyer */
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'hidden'){ if(cloud.on && cloud.pending) cloud.flush(); return; }
    if(!auth.session){                          // connecté entre-temps dans un autre onglet (lien de l'e-mail)
      auth.load();
      if(auth.session){ closeModal(); await cloud.start(); }
      return;
    }
    if(!cloud.on){ await cloud.start(); return; }
    if(cloud.pending) await cloud.flush();
    if(!cloud.pending && !$('#modal').classList.contains('on')){
      try{ await cloud.pull(); }catch(e){}
    }
  });
  window.addEventListener('storage', async e=>{
    if(e.key === LS_SESSION){
      auth.load();
      if(auth.session && !cloud.on){ closeModal(); await cloud.start(); }
      else if(!auth.session && cloud.on){ cloud.on = false; paintSync(); }   // déconnecté dans un autre onglet
    }
  });
}

function paintAccount(){
  if(!CLOUD_OK) return;
  $('#acctBtn').classList.toggle('off', !cloud.on);
  $('#acctLab').textContent = !auth.session ? 'Se connecter' : (cloud.foyer || 'Mon foyer');
}
function paintSync(){ paintAccount(); renderWeek(); }

/* ---------- écrans de connexion ---------- */
const SEND_LABEL = 'Recevoir le lien de connexion';
/* message lisible pour une erreur d'envoi d'e-mail */
function sendErrMsg(e){
  return /rate|security purposes|seconds|too many/i.test(e.message)
    ? 'Trop de demandes rapprochées : le nombre d’e-mails est limité (quelques-uns par heure). Utilise le dernier lien reçu, ou réessaie plus tard.'
    : 'Envoi impossible : ' + e.message;
}
function openLogin(email = '', err = ''){
  openModal(`
    <h2>Connexion</h2>
    <div class="muted" style="margin-bottom:6px">Connecte-toi avec ton adresse e-mail pour partager recettes, calendrier et courses avec ton foyer, sur tous tes appareils. Pas de mot de passe : tu reçois un lien de connexion par e-mail.</div>
    <form id="loginForm" autocomplete="on">
      <label class="f">Adresse e-mail</label>
      <input type="email" id="lEmail" required autocomplete="email" inputmode="email" placeholder="prenom@exemple.fr" value="${esc(email)}">
      <div class="err" id="lErr">${esc(err)}</div>
      <div class="foot">
        <button type="button" class="btn ghost" data-act="localonly">Plus tard</button>
        <button type="submit" class="btn" id="lGo">${SEND_LABEL}</button>
      </div>
    </form>
  `);
  $('#loginForm').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const mail = $('#lEmail').value.trim().toLowerCase();
    if(!mail) return;
    $('#lGo').disabled = true; $('#lGo').textContent = 'Envoi…'; $('#lErr').textContent = '';
    try{ await auth.sendCode(mail); openCode(mail); }
    catch(e){
      $('#lErr').textContent = sendErrMsg(e);
      $('#lGo').disabled = false; $('#lGo').textContent = SEND_LABEL;
    }
  });
}
function openCode(email){
  openModal(`
    <h2>Vérifie tes e-mails</h2>
    <div class="muted" style="margin-bottom:6px">Un e-mail vient d’être envoyé à <b>${esc(email)}</b>. Ouvre-le <b>sur cet appareil</b> et clique sur le lien qu’il contient : l’app s’ouvrira et tu seras connecté·e. Pense à regarder dans les spams.</div>
    <div class="err" id="rErr"></div>
    <div class="foot">
      <button type="button" class="btn ghost" data-act="relogin" data-email="${esc(email)}">Changer d’adresse</button>
      <button type="button" class="btn ghost" id="rGo">Renvoyer l’e-mail</button>
    </div>
    <details class="help" style="margin-top:14px">
      <summary>J’ai reçu un code à la place</summary>
      <form id="codeForm">
        <input type="text" id="lCode" class="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" style="margin-top:8px">
        <div class="err" id="lErr"></div>
        <button type="submit" class="btn block" id="cGo">Valider le code</button>
      </form>
    </details>
  `);
  $('#rGo').addEventListener('click', async ()=>{
    $('#rGo').disabled = true; $('#rErr').textContent = '';
    try{ await auth.sendCode(email); toast('Nouvel e-mail envoyé'); }
    catch(e){ $('#rErr').textContent = sendErrMsg(e); }
    $('#rGo').disabled = false;
  });
  $('#codeForm').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const code = $('#lCode').value.replace(/\D/g,'');
    if(!code) return;
    $('#cGo').disabled = true; $('#lErr').textContent = '';
    try{
      await auth.verify(email, code);
      localStorage.removeItem(LS_LOCALONLY);
      closeModal(); toast('Connecté·e');
      await cloud.start();
    }catch(e){
      $('#lErr').textContent = 'Code invalide ou expiré.';
      $('#cGo').disabled = false;
    }
  });
}

/* ---------- « Mon foyer » : membres, invitations, déconnexion ---------- */
async function openFoyer(){
  if(!auth.session){ openLogin(); return; }
  openModal(`
    <h2>Mon foyer</h2>
    <div class="muted">Connecté·e : <b>${esc(auth.email)}</b></div>
    <div id="foyerBody" style="margin-top:6px"><div class="muted" style="margin-top:12px">Chargement…</div></div>
    <div class="foot">
      <button class="btn ghost" data-act="closemodal">Fermer</button>
      <button class="btn danger" data-act="logout">Se déconnecter</button>
    </div>
  `);
  const body = $('#foyerBody');

  if(!cloud.foyer){
    body.innerHTML = `
      <div class="empty" style="padding:16px;margin:12px 0">Ton adresse n’est rattachée à aucun foyer.<br>
        <span class="muted">Demande à un membre de t’inviter avec cette adresse, ou crée un nouveau foyer.</span></div>
      <button class="btn ghost block" data-act="refoyer">J’ai été invité·e — réessayer</button>
      <label class="f">Créer un nouveau foyer</label>
      <div class="row">
        <input type="text" id="newFoyer" placeholder="Ex. famille-dupont" style="flex:1">
        <button class="btn sm" id="newFoyerOk" style="flex:none">Créer</button>
      </div>
      <div class="err" id="fErr"></div>`;
    $('#newFoyerOk').addEventListener('click', async ()=>{
      const nom = $('#newFoyer').value.trim();
      if(nom.length < 3){ $('#fErr').textContent = 'Choisis un nom d’au moins 3 caractères.'; return; }
      try{
        await db('rpc/creer_foyer', { method:'POST', body:JSON.stringify({ nom }) });
        if(!confirm('Copier dans ce nouveau foyer les recettes déjà présentes sur cet appareil ?\n(Annuler = foyer vide)')){
          state = { recipes:[], plan:{}, shopping:[], eaters:[] }; store.saveLocal(); render();
        }
        localStorage.setItem(LS_FOYER, nom);
        await cloud.start();
        if(cloud.foyer) openFoyer();
        toast('Foyer créé');
      }catch(e){
        $('#fErr').textContent = /déjà pris/.test(e.message) ? 'Ce nom de foyer est déjà pris.'
          : /schema cache|does not exist/i.test(e.message) ? 'La base Supabase n’est pas encore configurée : exécute le script supabase_setup.sql dans Supabase (SQL Editor).'
          : 'Création impossible : ' + e.message;
      }
    });
    return;
  }

  try{
    const rows = await db('foyer_membres?select=email&order=email&foyer_id=eq.' + encodeURIComponent(cloud.foyer));
    body.innerHTML = `
      <label class="f">Foyer</label>
      ${cloud.foyers.length > 1
        ? `<select id="foyerSel">${cloud.foyers.map(f=>`<option value="${esc(f)}"${f===cloud.foyer?' selected':''}>${esc(f)}</option>`).join('')}</select>`
        : `<div style="font-weight:650">${esc(cloud.foyer)} <span class="pill ${cloud.on?'cloud':'local'}" style="margin-left:6px">${cloud.on?'synchronisé':'hors ligne'}</span></div>`}
      <label class="f">Membres</label>
      <div class="card" style="padding:4px 12px;box-shadow:none;margin:0">
        ${(rows||[]).map(r=>`
          <div class="shopitem">
            <div class="txt">${esc(r.email)}${r.email===auth.email?' <small>c’est toi</small>':''}</div>
            ${r.email===auth.email ? '' : `<button class="x" data-act="delmembre" data-email="${esc(r.email)}" aria-label="Retirer">×</button>`}
          </div>`).join('')}
      </div>
      <label class="f">Inviter quelqu’un</label>
      <div class="row">
        <input type="email" id="invEmail" placeholder="adresse@exemple.fr" autocomplete="off" style="flex:1">
        <button class="btn sm" id="invOk" style="flex:none">Inviter</button>
      </div>
      <div class="err" id="fErr"></div>
      <div class="muted">Aucun e-mail d’invitation n’est envoyé : préviens la personne qu’elle peut maintenant se connecter à l’app avec cette adresse.</div>`;

      if(cloud.pending) await cloud.flush();
      localStorage.setItem(LS_FOYER, sel.value);
      await cloud.start(); openFoyer();
    });
    const invite = async ()=>{
      const mail = $('#invEmail').value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ $('#fErr').textContent = 'Adresse e-mail invalide.'; return; }

        await db('foyer_membres', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ foyer_id:cloud.foyer, email:mail }) });

      }catch(e){
        $('#fErr').textContent = e.status === 409 ? 'Cette personne est déjà membre.' : 'Invitation impossible : ' + e.message;

    };

    body.innerHTML = `<div class="err" style="margin-top:12px">Impossible de charger le foyer (${esc(e.message)}).</div>`;

async function doLogout(){
  if(!confirm('Se déconnecter ?\nLes données du foyer seront retirées de cet appareil (elles restent en ligne pour les autres membres).')) return;
  if(cloud.on && cloud.pending) await cloud.flush();

/* ============================================================
   OUTILS "RECETTES DANS LE PLAN"
   ============================================================ */
function recipesOfDay(dateKey){
  const day = state.plan[dateKey] || {};
  return SLOTS.flatMap(s => (day[s.k]||[]));
}
function recipesOfWeek(anchor){
  return weekDates(anchor).flatMap(d => recipesOfDay(isoOf(d)));
}
function findRecipe(id){ return state.recipes.find(r => r.id === id); }
/* un plat du plan est un id (ancien format) ou { id, who } */
function eidOf(e){ return typeof e === 'string' ? e : (e && e.id); }
function whoOf(e){ return (e && typeof e === 'object' && e.who) ? e.who : ''; }
/* convertit les anciens plats (id nu, ou entrée sans id) au format { id, who } */
function migrer(){
  let changed = false;
  Object.keys(state.plan).forEach(k=>{
    const day = state.plan[k] || {};
    SLOTS.forEach(s=>{
      const list = day[s.k];
      if(Array.isArray(list)){
        const clean = list.map(e=>{
          if(typeof e === 'string'){ changed = true; return { id:e, who:'' }; }
          if(e && e.id) return { id:e.id, who:e.who||'' };
          changed = true; return null;
        }).filter(Boolean);
        day[s.k] = clean;
      } else {
        day[s.k] = [];
      }
    });
    state.plan[k] = day;
  });
  if(changed) localStorage.setItem(LS, JSON.stringify(state));
}
/* liste des destinataires connus : profils enregistrés + saisies libres */
function knownEaters(){
  const used = new Set(state.eaters);
  Object.keys(state.plan).forEach(k=>{
    SLOTS.forEach(s => ((state.plan[k] || {})[s.k] || []).forEach(e=>{ const w = whoOf(e); if(w) used.add(w); }));
  });
  return Array.from(used).sort((a,b)=>a.localeCompare(b,'fr'));
}

function renderWeek(){
  const dates = weekDates(ANCHOR);

  el.textContent = cloud.on
    ? total + (total>1?' plats · synchronisé':' plat · synchronisé')

  const todayKey = isoOf(new Date());
  $('#weekDays').innerHTML = dates.map(d=>{
    const key = isoOf(d);
    const day = state.plan[key] || {};
    const isToday = key === todayKey;
    const isPast = key < todayKey;                 // dates ISO : l'ordre alphabétique est l'ordre chronologique
    const slots = SLOTS.map(s=>{
      const list = day[s.k] || [];
      return `
        <div class="slot">

            return `<div class="chip">

          }).join('')}

    }).join('');
    return `<div class="day${isToday?' today':''}${isPast?' past':''}">
      <div class="day-h">
        <span class="dname">${DAYS[(d.getDay()+6)%7]}</span>

let selYear = null;                            // année autour de laquelle la liste a été construite
let selAnchor = '';                            // semaine du calendrier lors du dernier alignement
function renderWeekSelect(force){
  const { week, year } = isoWeek(ANCHOR);
  const sel = $('#impWeek');
  /* garde la semaine choisie dans « Courses » tant que le calendrier n'a pas changé de semaine */
  if(!force && selAnchor === year + '-' + week && sel.value) return;
  selAnchor = year + '-' + week;
  if(selYear !== year){                        // reconstruit si on a changé d'année
    const opts = [];
    for(let y = year-1; y <= year+1; y++){
      for(let w = 1; w <= weeksInYear(y); w++){
        const mon = mondayOfWeek(y,w);
        opts.push(`<option value="${y}-${w}">Semaine ${w} — ${y} · du ${fmtDate(mon)} au ${fmtDate(addDays(mon,6))}</option>`);
      }
    }
    sel.innerHTML = opts.join('');
    selYear = year;
  }
  sel.value = year + '-' + week;
}
/* recettes (uniques) et ingrédients regroupés d'une semaine ISO */
function weekIngredients(y, w){
  const mon = mondayOfWeek(y,w);
  const dates = DAYS.map((_,i)=> addDays(mon,i));
  const ids = dates.flatMap(d => recipesOfDay(isoOf(d)).map(eidOf));
  const recipes = Array.from(new Set(ids)).map(findRecipe).filter(Boolean);
  const groups = {};
  recipes.forEach(r => (r.ingredients||[]).forEach(i=>{
    const unit = i.unit || '';
    const k = i.name.trim().toLowerCase() + '|' + unit;     // 200 g et 1 botte ne s'additionnent pas
    if(!groups[k]) groups[k] = { name:i.name.trim(), qty:0, unit, src:new Set() };
    groups[k].qty = Math.round((groups[k].qty + (Number(i.qty)||0)) * 100) / 100;
    groups[k].src.add(r.name);
  }));
  const keys = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'fr'));
  return { recipes, groups, keys };
}
function renderImport(){
  const v = $('#impWeek').value; if(!v) return;
  const [y,w] = v.split('-').map(Number);
  const { recipes:uniq, groups, keys } = weekIngredients(y, w);

  if(!uniq.length){
    $('#impPreview').innerHTML = `<div class="empty" style="padding:16px">Aucune recette programmée cette semaine-là.</div>`;
    return;
  }
  $('#impPreview').innerHTML = `
    <div class="muted" style="margin-bottom:8px">${uniq.length} recette${uniq.length>1?'s':''} · ${keys.length} produit${keys.length>1?'s':''}</div>

    <div style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px 10px;background:var(--sheet)">
      ${keys.map(k=>`<div class="ingrow"><span style="flex:1">${esc(groups[k].name)}</span><span class="q">${esc(qtyLabel(groups[k].qty, groups[k].unit))}</span></div>`).join('')}

      <button class="btn ghost sm" style="flex:1" data-act="import" data-mode="replace">Remplacer</button>
    </div>`;
}

    ${state.eaters.length ? state.eaters.map(n=>`
      <div class="shopitem">
        <div class="txt">${esc(n)}</div>
        <button class="x" data-act="deleater" data-name="${esc(n)}" aria-label="Retirer">×</button>
      </div>`).join('') : '<div class="empty" style="padding:16px">Aucun nom enregistré pour l’instant.</div>'}
    <label class="f">Ajouter un nom</label>
    <div class="row">
      <input type="text" id="eaterNew" placeholder="Ex. Léo" style="flex:1">
      <button class="btn sm" id="eaterOk" style="flex:none">Ajouter</button>
    </div>
    <div class="foot"><button class="btn ghost" data-act="closemodal">Fermer</button></div>
  `);
  const add = ()=>{
    const v = $('#eaterNew').value.trim();
    if(!v) return;
    if(!state.eaters.includes(v)) state.eaters.push(v);
    store.save(); render(); openEaterForm();
  };
  $('#eaterOk').addEventListener('click', add);
  $('#eaterNew').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); }});
}

/* ---- import courses ---- */
function doImport(mode){
  const v = $('#impWeek').value; if(!v) return;
  const [y,w] = v.split('-').map(Number);
  const { recipes, groups, keys } = weekIngredients(y, w);
  if(!recipes.length){ toast('Aucune recette cette semaine-là'); return; }

  const items = keys.map(k=>({
    id: uid(),
    label: groups[k].name + (groups[k].qty ? ' — ' + qtyLabel(groups[k].qty, groups[k].unit) : ''),
    key: k,
    src: 'Semaine ' + w + ' · ' + Array.from(groups[k].src).join(', '),
    done: false
  }));

  if(mode === 'replace'){
    state.shopping = items;
  } else {
    const known = new Set(state.shopping.filter(i=>!i.done && i.key).map(i=>i.key));
    const fresh = items.filter(i=>!known.has(i.key));
    state.shopping = state.shopping.concat(fresh);
    if(!fresh.length) toast('Tous ces produits sont déjà dans la liste');
    else toast(fresh.length + ' produit' + (fresh.length>1?'s':'') + ' ajouté' + (fresh.length>1?'s':''));
  }
  store.save(); render();
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  const id  = t.dataset.id;

  switch(act){
    case 'unplan': {
      const day = state.plan[t.dataset.date];
      if(day){
        const list = day[t.dataset.slot] || [];
        const pos = list.findIndex(e => eidOf(e) === id);
        if(pos >= 0) list.splice(pos, 1);
      }
      store.save(); render(); break;
    }
    case 'plan':    openPicker(t.dataset.date, t.dataset.slot); break;
    case 'doplan': {
      const key = t.dataset.date;
      const slot = t.dataset.slot || (pickerCtx && pickerCtx.slot);
      const date = key || (pickerCtx && pickerCtx.dateKey);
      state.plan[date] = state.plan[date] || { midi:[], soir:[] };
      state.plan[date].midi = state.plan[date].midi || [];
      state.plan[date].soir = state.plan[date].soir || [];
      state.plan[date][slot] = state.plan[date][slot] || [];
      if(!state.plan[date][slot].some(e => eidOf(e) === id)) state.plan[date][slot].push({ id, who:'' });
      store.save(); closeModal(); render();
      toast('Plat ajouté au calendrier');
      break;
    }
    case 'openrec': openRecipe(id); break;
    case 'editrec': openRecipeForm(id); break;
    case 'planfrom': openSlotPicker(id); break;
    case 'delrec': {
      const rr = findRecipe(id);
      if(!confirm('Supprimer « ' + (rr ? rr.name : 'cette recette') + ' » ? Elle sera aussi retirée du calendrier.')) break;
      state.recipes = state.recipes.filter(r=>r.id!==id);
      Object.keys(state.plan).forEach(k=>{
        SLOTS.forEach(s=>{
          if(state.plan[k][s.k]) state.plan[k][s.k] = state.plan[k][s.k].filter(x=>eidOf(x)!==id);
        });
      });
      store.save(); closeModal(); render(); toast('Recette supprimée');
      break;
    }
    case 'adding': $('#ingWrap').insertAdjacentHTML('beforeend', ingredientRow()); break;
    case 'deling': t.closest('.ingline').remove(); break;
    case 'ftag': filterTag = t.dataset.tag || null; renderRecipes(); break;
    case 'closemodal': closeModal(); break;
    case 'ck': {
      const it = state.shopping.find(x=>x.id===id);
      if(it){ it.done = !it.done; store.save(); renderShop(); }
      break;
    }
    case 'delitem': state.shopping = state.shopping.filter(x=>x.id!==id); store.save(); renderShop(); break;
    case 'import': doImport(t.dataset.mode); break;
    case 'eater': openEaterForm(); break;
    case 'localonly': localStorage.setItem(LS_LOCALONLY,'1'); closeModal(); toast('Données gardées sur cet appareil'); break;
    case 'relogin': openLogin(t.dataset.email); break;
    case 'logout': doLogout(); break;
    case 'refoyer': cloud.start().then(()=>{ if(cloud.foyer) openFoyer(); }); break;
    case 'delmembre': {
      const mail = t.dataset.email;
      if(!confirm('Retirer ' + mail + ' du foyer ?')) break;
      db('foyer_membres?foyer_id=eq.' + encodeURIComponent(cloud.foyer) + '&email=eq.' + encodeURIComponent(mail), { method:'DELETE' })
        .then(()=>{ toast('Membre retiré'); openFoyer(); })
        .catch(err=>toast('Impossible : ' + err.message));
      break;
    }
    case 'whofor': openWhofor(t.dataset.date, t.dataset.slot, id); break;
    case 'deleater': state.eaters = state.eaters.filter(x=>x!==t.dataset.name); store.save(); render(); toast('Profil retiré'); break;
    case 'doplanfor': {
      const key = t.dataset.date, slot = t.dataset.slot, rid = t.dataset.id;
      state.plan[key] = state.plan[key] || { midi:[], soir:[] };
      state.plan[key][slot] = state.plan[key][slot] || [];
      const pos = state.plan[key][slot].findIndex(e => eidOf(e) === rid);
      if(pos >= 0){
        const who = t.dataset.who || '';
        state.plan[key][slot][pos] = Object.assign({}, state.plan[key][slot][pos], { who });
      }
      store.save(); closeModal(); render(); toast('Destinataire mis à jour');
      break;
    }
  }
});

/* --- navigation --- */
$$('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    $$('nav.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    $$('.view').forEach(v=>v.classList.remove('on'));
    $('#v-' + b.dataset.v).classList.add('on');
    if(b.dataset.v === 'cal') scrollToToday();   // calendrier : directement sur le jour actuel
    else window.scrollTo({top:0});
  });
});

/* --- semaine --- */
$('#prevW').addEventListener('click', ()=>{ ANCHOR = addDays(ANCHOR,-7); render(); });
$('#nextW').addEventListener('click', ()=>{ ANCHOR = addDays(ANCHOR,7); render(); });
$('#prevW2').addEventListener('click', ()=>{
  const [y,w] = $('#impWeek').value.split('-').map(Number);
  const prev = w>1 ? [y,w-1] : [y-1,weeksInYear(y-1)];
  const v = prev[0]+'-'+prev[1];
  if($('#impWeek').querySelector(`option[value="${v}"]`)){ $('#impWeek').value = v; renderImport(); }
});
$('#nextW2').addEventListener('click', ()=>{
  const [y,w] = $('#impWeek').value.split('-').map(Number);
  const next = w<weeksInYear(y) ? [y,w+1] : [y+1,1];
  const v = next[0]+'-'+next[1];
  if($('#impWeek').querySelector(`option[value="${v}"]`)){ $('#impWeek').value = v; renderImport(); }
});
$('#todayBtn').addEventListener('click', ()=>{ ANCHOR = new Date(); ANCHOR.setHours(0,0,0,0); render(); scrollToToday(true); });
$('#eatersBtn').addEventListener('click', openEaterForm);
$('#acctBtn').addEventListener('click', ()=> auth.session ? openFoyer() : openLogin());

$('#pickWeekBtn').addEventListener('click', ()=>{
  const cur = isoWeek(ANCHOR), now = isoWeek(new Date()).year;
  const years = Array.from(new Set([now-1, now, now+1, cur.year])).sort((a,b)=>a-b);
  openModal(`
    <h2>Aller à une semaine</h2>
    <label class="f">Année</label>
    <select id="goYear">${years.map(y=>`<option${y===cur.year?' selected':''}>${y}</option>`).join('')}</select>
    <label class="f">Semaine</label>
    <select id="goWeek"></select>
    <div class="foot"><button class="btn ghost" data-act="closemodal">Annuler</button><button class="btn" id="goOk">Y aller</button></div>
  `);
  /* 52 ou 53 semaines selon l'année choisie */
  const fillWeeks = ()=>{
    const y = parseInt($('#goYear').value,10);
    const keep = Math.min(parseInt($('#goWeek').value,10) || cur.week, weeksInYear(y));
    $('#goWeek').innerHTML = Array.from({length:weeksInYear(y)},(_,i)=>i+1)
      .map(w=>`<option value="${w}"${w===keep?' selected':''}>Semaine ${w}</option>`).join('');
  };
  fillWeeks();
  $('#goYear').addEventListener('change', fillWeeks);
  $('#goOk').addEventListener('click', ()=>{
    ANCHOR = mondayOfWeek(parseInt($('#goYear').value,10), parseInt($('#goWeek').value,10));
    closeModal(); render();
  });
});
$('#weekToCart').addEventListener('click', ()=>{
  $$('nav.tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelector('nav.tabs button[data-v="shop"]').classList.add('on');
  $$('.view').forEach(v=>v.classList.remove('on'));
  $('#v-shop').classList.add('on');
  renderWeekSelect(true); renderImport();
  window.scrollTo({top:0});
});

/* --- recettes --- */
$('#newRec').addEventListener('click', ()=> openRecipeForm(null));
$('#qRec').addEventListener('input', renderRecipes);

/* --- courses --- */
function addManual(){
  const v = $('#newItem').value.trim();
  if(!v) return;
  state.shopping.push({ id:uid(), label:v, key:null, src:'', done:false });
  $('#newItem').value = '';
  store.save(); renderShop(); toast('Produit ajouté');
}
$('#addItem').addEventListener('click', addManual);
$('#newItem').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addManual(); }});
$('#clearDone').addEventListener('click', ()=>{
  state.shopping = state.shopping.filter(i=>!i.done);
  store.save(); renderShop(); toast('Liste nettoyée');
});
$('#impWeek').addEventListener('change', renderImport);

/* --- démarrage --- */
store.local();
migrer();
render();
scrollToToday();
/* les polices et les données du foyer peuvent décaler la page : on se recale tant que personne n'a défilé */
const recaler = () => { if(!userScrolled) scrollToToday(); };
if(document.fonts) document.fonts.ready.then(recaler);
initCloud().then(recaler);
</script>

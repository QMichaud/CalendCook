<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<title>Mes Recettes — Calendrier &amp; Courses</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     THÈME « CAHIER À PETITS CARREAUX »
     papier crème quadrillé, encre bleue, surligneur jaune,
     marge rouge, titres manuscrits
     ============================================================ */
  :root{
    --paper:#F5DFCD;          /* fond de la page : papier pêche */
    --paper-2:#EFEADF;        /* papier un peu plus foncé (champs, code) */
    --sheet:#FFFDF8;          /* feuilles posées sur la page (cartes) */
    --past:#E6E1D5;           /* jours passés : papier plus sombre */
    --ink:#27324A;            /* texte : encre foncée */
    --ink-soft:#6B7386;       /* texte secondaire : crayon */
    --accent:#2F5DA8;         /* stylo bleu */
    --accent-deep:#224A8C;
    --accent-soft:#E7EDF7;
    --red:#C9534C;            /* stylo rouge / marge */
    --hl:#FFE680;             /* surligneur jaune */
    --hl-soft:#FFF6C9;        /* post-it */
    --hl-line:#EEDC8E;
    --line:#DDD6C7;           /* traits au crayon */
    --grid-c:rgba(47,93,168,.09);
    --grid:linear-gradient(var(--grid-c) 1px, transparent 1px),
           linear-gradient(90deg, var(--grid-c) 1px, transparent 1px);
    --grid-size:22px 22px;
    --shadow:0 1px 2px rgba(100,70,45,.14), 0 4px 14px rgba(100,70,45,.16);
    --radius:6px;
    --hand:"Caveat","Noteworthy","Segoe Print","Comic Sans MS",cursive;
    --safe:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background-color:var(--paper);
    background-image:var(--grid);
    background-size:var(--grid-size);
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;font-size:inherit;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}

  /* ---------- Header : haut de page avec la double marge rouge ---------- */
  header.app{
    position:sticky;top:0;z-index:20;
    background:var(--sheet);
    border-bottom:3px double rgba(201,83,76,.55);
    padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .brand{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .brand .dot{
    width:30px;height:30px;flex:none;border-radius:50%;background:var(--hl);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    transform:rotate(-8deg);
  }
  .brand .dot::before{content:"✎";color:var(--accent-deep)}
  .brand h1{font-family:var(--hand);font-size:30px;line-height:1;margin:0;font-weight:700;color:var(--accent-deep)}
  .brand small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Nav ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;background:rgba(255,253,248,.95);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe);
  }
  nav.tabs button{
    flex:1;border:0;background:none;padding:8px 4px 7px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-family:var(--hand);font-size:18px;line-height:1;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:color .15s;position:relative;
  }
  nav.tabs button svg{width:22px;height:22px;stroke-width:1.7}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs button.on svg{stroke:var(--accent)}
  nav.tabs button.on::after{          /* coup de surligneur sous l'onglet actif */
    content:"";position:absolute;left:30%;right:30%;bottom:5px;height:7px;
    background:var(--hl);opacity:.75;border-radius:4px;z-index:-1;
  }

  main{padding:16px 14px calc(96px + var(--safe));max-width:640px;margin:0 auto}
  main.ptr-back{transition:transform .25s cubic-bezier(.2,.8,.3,1)}
  /* « tirer pour actualiser » : indicateur sous l'en-tête */
  #ptr{
    position:fixed;left:0;right:0;top:var(--hdr, 70px);z-index:12;height:0;
    display:flex;align-items:flex-end;justify-content:center;gap:8px;overflow:hidden;
    font-size:13px;font-weight:800;color:var(--accent-deep);pointer-events:none;
  }
  #ptr .ptr-i{
    width:26px;height:26px;border-radius:50%;background:var(--sheet);border:1.5px solid rgba(47,93,168,.35);
    display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;transition:transform .15s;
  }
  #ptr .ptr-t{margin-bottom:14px}
  #ptr.ready .ptr-i{transform:rotate(180deg);background:var(--hl);border-color:var(--hl-line)}
  #ptr.busy .ptr-i{animation:ptrSpin .8s linear infinite;border-top-color:transparent}
  @keyframes ptrSpin{to{transform:rotate(360deg)}}
  .view{display:none}
  .view.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  /* ---------- Cartes : feuilles quadrillées posées sur la page ---------- */
  .card{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  h2.sec{
    font-family:var(--hand);font-size:26px;line-height:1.1;margin:0 0 10px;font-weight:700;color:var(--accent-deep);
    display:inline-block;background:linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%);
    padding:0 4px;
  }
  .muted{color:var(--ink-soft);font-size:13.5px}
  .empty{
    text-align:center;color:var(--ink-soft);font-size:14px;
    padding:26px 14px;border:1.5px dashed var(--line);border-radius:var(--radius);background:rgba(255,253,248,.7);
  }

  /* ---------- Boutons : encre bleue ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:0;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:700;
    background:var(--accent);color:#fff;cursor:pointer;transition:transform .08s,background .15s;
    box-shadow:0 2px 0 var(--accent-deep);
  }
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--accent-deep)}
  .btn:disabled{opacity:.6}
  .btn.block{width:100%}
  .btn.ghost{background:var(--accent-soft);color:var(--accent-deep);box-shadow:none}
  .btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);box-shadow:none}
  .btn.sm{padding:8px 12px;font-size:13.5px;border-radius:7px}
  .btn.danger{background:var(--sheet);color:var(--red);border:1.5px solid rgba(201,83,76,.35);box-shadow:none}
  .row{display:flex;gap:9px;align-items:center}
  .row.wrap{flex-wrap:wrap}

  /* ---------- Semaine ---------- */
  /* bloc des semaines : reste accroché sous l'en-tête, caché quand on descend,
     il réapparaît dès qu'on remonte */
  #weekDays{touch-action:pan-y}                      /* le glissement horizontal change de semaine */
  #weekDays.wk-drag{transition:none}
  #weekDays.wk-back{transition:transform .2s ease, opacity .2s ease}
  #weekDays.wk-in{animation:wkIn .24s cubic-bezier(.2,.8,.3,1)}
  @keyframes wkIn{from{transform:translateX(var(--wk-from, 40px));opacity:.2}to{transform:none;opacity:1}}
  /* blocs du haut (semaines, recettes) : accrochés sous l'en-tête, cachés quand
     on descend, rappelés dès qu'on remonte */
  .stickybar{
    position:sticky;top:var(--hdr, 70px);z-index:15;
    transition:transform .22s ease, opacity .22s ease;
  }
  /* bleu clair « intercalaire » pour se détacher du papier blanc */
  .stickybar{
    background-color:#E3EBF8;
    border:1.5px solid rgba(47,93,168,.38);
    box-shadow:0 2px 0 rgba(47,93,168,.18), 0 4px 12px rgba(39,50,74,.10);
  }
  .stickybar .btn.ghost,.stickybar .pill:not(.cloud){background:var(--sheet);border:1px solid rgba(47,93,168,.25)}
  .stickybar .iconbtn{border-color:rgba(47,93,168,.3)}
  #weekBar .row{flex-wrap:wrap;row-gap:8px}          /* petits écrans : le compteur passe à la ligne */
  #wCount{margin-left:auto}
  /* roue des réglages : juste le dessin, tracé à l'encre comme le reste */
  .gearbtn{
    width:38px;height:38px;flex:none;border:0;background:none;padding:0;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  }
  .gearbtn svg{width:26px;height:26px;fill:rgba(255,253,248,.7);stroke:var(--accent-deep);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
  .gearbtn:active svg{transform:rotate(60deg)}
  /* volet repliable (import depuis le calendrier) */
  details.fold > summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
  details.fold > summary::-webkit-details-marker{display:none}
  details.fold .fold-t{flex:1;min-width:0;display:flex;flex-direction:column}
  details.fold .fold-t h2.sec{margin-bottom:2px;align-self:flex-start}
  details.fold .fold-i svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
  details.fold[open] .fold-i svg{transform:rotate(180deg)}
  details.fold[open] > summary{margin-bottom:4px}
  .tagpick.imprec{background:var(--sheet);color:var(--ink-soft);text-decoration:line-through;text-decoration-color:rgba(107,115,134,.6)}
  .tagpick.imprec.on{background:var(--hl-soft);border-color:var(--hl-line);color:var(--ink);text-decoration:none}
  .stickybar.stuck{box-shadow:0 2px 0 rgba(47,93,168,.18), 0 8px 20px rgba(39,50,74,.20)}
  .stickybar.away{transform:translateY(calc(-100% - var(--hdr, 70px)));opacity:0;pointer-events:none}
  #recBar .tagbox{margin-top:10px}
  #recBar .tagpick{background:var(--sheet)}
  #recBar .tagpick.on{background:var(--hl)}
  .moretags{
    display:block;margin:8px 0 0;padding:2px 0;border:0;background:none;cursor:pointer;
    font-size:13px;font-weight:800;color:var(--accent);text-decoration:underline;text-underline-offset:3px;
  }
  .moretags[hidden]{display:none}
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .weeknav .lab{text-align:center;flex:1;min-width:0}
  .weeknav .lab b{display:block;font-family:var(--hand);font-size:30px;line-height:1;font-weight:700;color:var(--accent-deep)}
  .weeknav .lab span{font-size:12px;color:var(--ink-soft);font-weight:600}
  .iconbtn{
    width:40px;height:40px;flex:none;border-radius:8px;border:1px solid var(--line);
    background:var(--sheet);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .iconbtn:active{background:var(--accent-soft)}
  .iconbtn svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Jours ---------- */
  .day{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);
    border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);
    scroll-margin-top:calc(98px + env(safe-area-inset-top,0px));   /* ne passe pas sous l'en-tête */
  }
  .slotsw{display:flex;gap:5px;margin-left:auto;align-self:center}
  .sw{
    display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--sheet);
    border-radius:7px;padding:3px 7px 3px 5px;font-size:12px;font-weight:800;color:var(--ink-soft);cursor:pointer;
  }
  .sw-box{width:14px;height:14px;border-radius:3px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
  .sw.on{color:var(--accent-deep);border-color:rgba(47,93,168,.4);background:var(--accent-soft)}
  .day-h{flex-wrap:wrap;row-gap:6px}
  .day-h{
    display:flex;align-items:baseline;gap:8px;padding:8px 13px 4px;
    border-bottom:1.5px solid rgba(201,83,76,.4);           /* trait de marge rouge */
  }
  .day-h .dname{font-family:var(--hand);font-size:26px;line-height:1;font-weight:700;flex:1;color:var(--ink)}
  .day-h .dnum{font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .badge{
    font-family:var(--hand);font-size:19px;line-height:1;font-weight:700;color:var(--ink);
    background:var(--hl);border-radius:3px;padding:1px 7px 2px;transform:rotate(-2deg);
  }
  /* aujourd'hui : cadre au stylo bleu + nom surligné */
  .day.today{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft), var(--shadow)}
  .day.today .dname{color:var(--accent-deep)}
  /* jours passés : papier plus sombre, contenu estompé */
  .day.past{background-color:var(--past);box-shadow:none;border-color:#D3CCBC}
  .day.past .day-h{border-bottom-color:rgba(107,115,134,.3)}
  .day.past .dname,.day.past .dnum{color:#8A8F9C}
  .day.past .chip{background:rgba(255,255,255,.45);border-color:#D3CCBC;box-shadow:none}
  .day.past .chip .nm{color:#646B7A}
  .slot-none{font-size:13px;color:#A8A294;padding:0 4px 4px}
  .day.past .addmini{background:transparent;color:#8A8F9C;border-color:#CFC8B8}
  .day.past .tag{opacity:.75}
  .day.past .slot-t{color:#9A8F8C}

  .slots{padding:8px 11px 6px}
  .slot{margin-bottom:7px}
  .slot:last-child{margin-bottom:3px}
  .slot-t{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--red);margin:2px 0 5px 2px;font-weight:800}
  /* un plat = un post-it */
  .chip[data-act]{cursor:pointer;transition:transform .08s, box-shadow .12s}
  .chip[data-act]:active{transform:scale(.985);box-shadow:none}
  .chip .go{display:inline-block;margin-left:6px;color:var(--accent);font-weight:800;font-size:17px;line-height:1}
  .pickbar{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
  .pickbar .searchwrap{flex:1;min-width:0;margin-bottom:0}
  .pickbar select{width:auto;max-width:42%;flex:none;padding:10px 8px}
  .slotweek{font-family:var(--hand);font-size:23px;font-weight:700;color:var(--accent-deep);margin:14px 0 6px}
  .slotday-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
  .daycount{font-size:12px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);border-radius:10px;padding:1px 8px;white-space:nowrap}
  .daycount.none{background:transparent;color:var(--ink-soft);font-weight:600;padding:0}
  .chip{
    display:flex;align-items:center;gap:8px;background:var(--hl-soft);
    border:1px solid var(--hl-line);border-radius:3px;padding:8px 10px;margin-bottom:6px;
    box-shadow:0 1px 2px rgba(120,100,30,.12);
  }
  .chip .nm{flex:1;min-width:0;font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
  .chip .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
  .tag{
    display:inline-block;font-size:10.5px;background:transparent;color:var(--accent-deep);
    border:1px solid rgba(47,93,168,.35);border-radius:10px;padding:0 7px;font-weight:700;
  }
  .x{
    border:0;background:transparent;color:var(--ink-soft);cursor:pointer;
    width:28px;height:28px;flex:none;border-radius:6px;font-size:17px;line-height:1;
  }
  .x:active{background:rgba(0,0,0,.05)}
  .addmini{
    width:100%;border:1.5px dashed var(--line);background:rgba(255,253,248,.6);border-radius:6px;
    padding:7px;font-family:var(--hand);font-size:19px;line-height:1.1;color:var(--accent);font-weight:700;cursor:pointer;margin-bottom:6px;
  }

  /* ---------- Recettes ---------- */
  .rlist{display:flex;flex-direction:column;gap:10px}
  .rec{
    background:var(--sheet);border:1px solid var(--line);border-left:3px solid rgba(201,83,76,.55);
    border-radius:var(--radius);padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;
  }
  .rec:active{background:var(--paper-2)}
  .rec h3{margin:0 0 3px;font-family:var(--hand);font-size:25px;line-height:1.1;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
  .rec .meta{font-size:12.5px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
  .rec .ing{margin-top:7px;font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}

  /* ---------- Formulaires : lignes à remplir ---------- */
  label.f{display:block;font-size:12px;font-weight:800;color:var(--red);margin:12px 0 5px;letter-spacing:.6px;text-transform:uppercase}
  label.f:first-child{margin-top:0}
  input[type=text],input[type=email],input[type=number],input[type=search],select,textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;
    background:var(--sheet);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .grid2{display:grid;grid-template-columns:1fr 96px;gap:8px}
  label.f .opt{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink-soft)}
  .reclink{
    display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 12px;text-decoration:none;
    background:var(--accent-soft);border:1px solid rgba(47,93,168,.3);border-radius:8px;color:var(--accent-deep);
  }
  .reclink:active{background:#D8E3F5}
  .reclink-i{font-size:18px}
  .reclink-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .reclink-t small{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reclink-a{font-size:18px;font-weight:800}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2b label.f:first-child{margin-top:12px}
  h2.sec .sec-sub{font-size:19px;color:var(--ink-soft);font-weight:600}
  .ingline{display:grid;grid-template-columns:1fr 60px 82px 32px;gap:6px;margin-bottom:7px;align-items:center}
  .ingline input[type=number]{padding:10px 8px;text-align:center}
  .ingline select{padding:10px 4px;text-align:center}
  .ingline .x{width:32px;height:32px}
  .i-name.bad,.harm-in.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,70,60,.12)}
  .ingdrop{margin:-2px 0 9px;background:var(--sheet);border:1.5px solid var(--accent);border-radius:10px;padding:4px;
    box-shadow:0 6px 18px rgba(30,40,70,.12);max-height:260px;overflow-y:auto}
  .ingopt{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;
    padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
  .ingopt small{font-size:11.5px;color:var(--ink-soft)}
  .ingopt.hi{background:var(--accent-soft)}
  .ingopt.add{color:var(--accent);font-weight:700;border-top:1px dashed var(--line);border-radius:0 0 7px 7px}
  .ingdrop-hint{padding:9px 10px;color:var(--ink-soft);font-size:13.5px}
  .ingadd{padding:8px 8px 6px;display:flex;flex-direction:column;gap:7px}
  .ingadd .muted{font-size:12.5px}
  .ingsim{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .ingsim .tag{cursor:pointer;font:inherit;font-size:12.5px}
  .harm{padding:9px 0;border-bottom:1px dashed var(--line)}
  .harm-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;overflow-wrap:anywhere}
  .harm-h small{color:var(--ink-soft);flex:none}
  .harm-in{width:100%}
  .ingok{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
  .harmbar{display:flex;align-items:center;width:100%;margin-bottom:10px;padding:11px 14px;border-radius:10px;font:inherit;
    font-weight:700;font-size:14.5px;color:var(--ink);background:var(--hl-soft);border:1.5px dashed var(--hl-line);cursor:pointer;text-align:left}
  .harmbar span{margin-left:auto;font-size:18px}
  /* catégories de la liste de courses */
  .shopsortbar{gap:8px;margin:2px 0 8px;flex-wrap:wrap}
  .shopsortbar:empty{display:none}
  .shopcat{margin-top:6px}

  .catpick{display:flex;flex-direction:column;gap:6px}

  /* ---------- Recherche ---------- */

  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--ink-soft);fill:none;stroke-width:2}

  /* ---------- Fenêtres : une feuille qui monte ---------- */
  .modal{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(39,50,74,.38);backdrop-filter:blur(2px);

  .sheet{
    background-color:var(--sheet);background-image:var(--grid);background-size:var(--grid-size);

  .grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}   /* zone de prise plus large */

</head>

<script>
/* ============================================================
   DONNÉES
   ============================================================ */
const LS = 'mesrecettes.v1';

const DAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const SLOTS = [{k:'midi',l:'Midi'},{k:'soir',l:'Soir'}];

/* unités de mesure proposées dans le formulaire de recette */
const UNITS = [
  {k:'g',   l:'g'},
  {k:'kg',  l:'kg'},
  {k:'mg',  l:'mg'},
  {k:'ml',  l:'ml'},
  {k:'cl',  l:'cl'},
  {k:'l',   l:'L'},
  {k:'cc',  l:'c. à c.'},
  {k:'cs',  l:'c. à s.'},
  {k:'pcs', l:'pièce'},
  {k:'tranche', l:'tranche'},
  {k:'gousse',  l:'gousse'},
  {k:'pincee',  l:'pincée'},
  {k:'sachet',  l:'sachet'},
  {k:'boite',   l:'boîte'},
  {k:'botte',   l:'botte'},
  {k:'',    l:'—'}          // aucune unité (ex. « 2 œufs »)
];

/* libellé complet d'une quantité : « 200 g », « 3 pièces », « 2 » */
function qtyLabel(q, u){
  const val = (q === '' || q === null || q === undefined || isNaN(q)) ? '' : q;
  const unit = UNITS.find(x=>x.k === (u||''));
  const short = !u || u === 'pcs' ? '' : (unit ? unit.l : u);
  return [val, short].filter(Boolean).join(' ');
}

let state = { recipes:[], plan:{}, shopping:[], eaters:[] };

/* ---------- petites utilitaires ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2000);
}
function fmtDate(d){
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
/* --- date ISO locale (pas de décalage UTC) --- */
/* jour déjà passé ? (dates ISO : l'ordre alphabétique est l'ordre chronologique) */
function isPastKey(key){ return key < isoOf(new Date()); }
function isoOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* --- numéro de semaine ISO 8601 --- */
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return { week: Math.ceil((((d - y0)/86400000)+1)/7), year: d.getUTCFullYear() };
}
/* --- lundi de la semaine ISO "week" de l'année "year" --- */
function mondayOfWeek(year, week){
  const jan4 = new Date(year, 0, 4);
  const dow = (jan4.getDay() || 7);
  const mon = new Date(year, 0, 4 - dow + 1);
  mon.setDate(mon.getDate() + (week - 1) * 7);
  mon.setHours(0,0,0,0);
  return mon;
}
/* --- nombre de semaines ISO d'une année (52 ou 53, ex. 2026 en a 53) --- */
function weeksInYear(year){
  return isoWeek(new Date(year, 11, 28)).week;
}
function addDays(d, n){
  const x = new Date(d); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x;
}
function weekDates(anchor){                    // 7 dates, lundi -> dimanche
  const { week, year } = isoWeek(anchor);
  const mon = mondayOfWeek(year, week);
  return DAYS.map((_,i)=> addDays(mon, i));
}
function grouped(arr, fn){                     // regroupe une liste par clé
  const m = {}; for (const x of arr){ const k = fn(x); (m[k] = m[k] || []).push(x); } return m;
}

/* ============================================================
   SYNCHRONISATION MULTI-APPAREILS (Supabase — optionnel)
   ------------------------------------------------------------
   Les identifiants sont dans config.js. Chaque personne se
   connecte avec son e-mail (lien reçu par mail, ou code), puis
   partage les données des « foyers » dont elle est membre.
   Si config.js est vide, l'app fonctionne en local uniquement.
   ============================================================ */
const cfg = (typeof APP_CONFIG !== 'undefined') ? APP_CONFIG : {};
const SUPABASE_URL = (cfg.SUPABASE_URL || '').replace(/\/+$/,'');
const SUPABASE_KEY = cfg.SUPABASE_KEY || '';
const PREF_FOYER   = cfg.ROOM || '';            // foyer choisi par défaut si on est membre de plusieurs
const CLOUD_OK     = !!(SUPABASE_URL && SUPABASE_KEY);
const LS_SESSION   = 'mesrecettes.session';
const LS_FOYER     = 'mesrecettes.foyer';
const LS_LOCALONLY = 'mesrecettes.localonly';
const LS_PAIR      = 'mesrecettes.pair';      // transfert de connexion en attente (app de l'écran d'accueil)
/* app ouverte depuis l'écran d'accueil (et non dans Safari / un navigateur) */
const STANDALONE   = window.navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);

/* ---------- connexion (API Supabase Auth, sans librairie externe) ---------- */
const auth = {
  session: null, _refreshing: null,
  load(){
    try{ this.session = JSON.parse(localStorage.getItem(LS_SESSION)); }catch(e){ this.session = null; }
  },
  save(s){
    this.session = s ? {
      access_token:  s.access_token,
      refresh_token: s.refresh_token,
      expires_at:    Number(s.expires_at) || (Math.floor(Date.now()/1000) + (Number(s.expires_in) || 3600)),
      email:         String((s.user && s.user.email) || s.email || '').toLowerCase()
    } : null;
    if(this.session) localStorage.setItem(LS_SESSION, JSON.stringify(this.session));
    else localStorage.removeItem(LS_SESSION);
  },
  get email(){ return this.session ? this.session.email : ''; },
  async call(path, body, token){
    const r = await fetch(SUPABASE_URL + '/auth/v1/' + path, {
      method: 'POST',
      headers: Object.assign({ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, token ? { Authorization:'Bearer '+token } : {}),
      body: JSON.stringify(body || {})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw Object.assign(new Error(j.msg || j.error_description || j.message || ('HTTP '+r.status)), { status:r.status });
    return j;
  },
  /* envoie l'e-mail contenant le lien (et le code, si le modèle d'e-mail l'inclut) */
  sendCode(email){
    let back = location.origin + location.pathname;
    /* depuis l'écran d'accueil, le lien s'ouvrira dans Safari : on y joint un identifiant
       secret pour que le navigateur nous transmette la connexion (voir pair.* plus bas) */
    if(STANDALONE) back += '?pair=' + pair.create();
    return this.call('otp?redirect_to=' + encodeURIComponent(back), { email, create_user:true });
  },
  async verify(email, token){
    const s = await this.call('verify', { type:'email', email, token });
    s.email = email; this.save(s); return s;
  },
  /* retour depuis le lien de l'e-mail : l'adresse contient #access_token=…&refresh_token=… */
  async fromUrl(keep = true){
    const h = new URLSearchParams(location.hash.slice(1));
    const q = new URLSearchParams(location.search);
    const clean = () => history.replaceState(null, '', location.pathname);
    /* lien expiré ou déjà utilisé : Supabase renvoie l'erreur dans l'adresse (#… ou ?…) */
    const err = h.get('error_description') || h.get('error') || q.get('error_description') || q.get('error');
    if(err){ clean(); throw new Error(err); }
    if(!h.get('access_token')) return false;
    clean();
    const s = { access_token:h.get('access_token'), refresh_token:h.get('refresh_token'),
                expires_in:h.get('expires_in'), expires_at:h.get('expires_at') };
    const r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer '+s.access_token } });
    if(!r.ok) throw new Error('Lien invalide');
    s.user = await r.json();
    if(keep) this.save(s);
    return s;
  },
  /* jeton valide (rafraîchi automatiquement quand il expire) */
  async token(){
    if(!this.session) return null;
    if(this.session.expires_at - 60 > Date.now()/1000) return this.session.access_token;
    if(!this._refreshing){
      const email = this.email;
      this._refreshing = this.call('token?grant_type=refresh_token', { refresh_token:this.session.refresh_token })
        .then(s => { s.email = email; this.save(s); })
        .catch(e => { if(e.status >= 400 && e.status < 500) this.save(null); throw e; })   // session révoquée
        .finally(() => { this._refreshing = null; });
    }
    await this._refreshing;
    return this.session && this.session.access_token;
  },
  async logout(){
    const t = this.session && this.session.access_token;
    this.save(null);
    if(t){ try{ await this.call('logout', {}, t); }catch(e){} }
  }
};

/* ---------- accès à la base avec le jeton de la personne connectée ---------- */
async function db(path, opts = {}){
  const t = await auth.token();
  if(!t) throw Object.assign(new Error('Non connecté'), { status:401 });
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({ apikey:SUPABASE_KEY, Authorization:'Bearer '+t, 'Content-Type':'application/json' }, opts.headers || {})
  }));
  if(!r.ok){
    const j = await r.json().catch(()=>({}));
    throw Object.assign(new Error(j.message || ('HTTP '+r.status)), { status:r.status, code:j.code });
  }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

/* ---------- données partagées du foyer ---------- */
/* ============================================================
   FUSION DES MODIFICATIONS (plusieurs membres en même temps)
   ------------------------------------------------------------
   Fusion « à trois voies » : on compare la dernière version commune
   avec le serveur (base), la version de cet appareil (local) et
   celle du serveur (remote). Ce que chacun a ajouté, modifié ou
   supprimé depuis la base est conservé ; en cas de modification du
   même champ des deux côtés, cet appareil l'emporte.
   ============================================================ */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const clone = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
/* valeur simple : on garde le changement, s'il y en a un */
function pick3(b, l, r){ return same(l, b) ? r : l; }
/* objet : champ par champ */
function mergeObj3(b, l, r){
  b = b || {}; l = l || {}; r = r || {};
  const out = {};
  new Set([...Object.keys(r), ...Object.keys(l)]).forEach(k => {
    const inL = k in l, inR = k in r, inB = k in b;
    if(inL && inR) out[k] = pick3(b[k], l[k], r[k]);
    else if(inL){ if(!inB || !same(l[k], b[k])) out[k] = l[k]; }          // ajouté ici (ou modifié alors que supprimé là-bas)
    else if(inR){ if(!inB || !same(r[k], b[k])) out[k] = r[k]; }          // ajouté là-bas
  });
  return out;
}
/* liste d'éléments identifiés par .id (recettes, courses, plats d'un créneau) */
function mergeList3(b, l, r){
  b = b || []; l = l || []; r = r || [];
  const byId = a => new Map(a.filter(x => x && x.id).map(x => [x.id, x]));
  const B = byId(b), L = byId(l), R = byId(r);
  const out = [];
  const take = id => {
    const x = L.get(id), y = R.get(id), z = B.get(id);
    if(x && y) return same(x, y) ? y : mergeObj3(z, x, y);
    if(x) return (!z || !same(x, z)) ? x : null;       // supprimé là-bas : on suit, sauf si modifié ici
    if(y) return (!z || !same(y, z)) ? y : null;       // supprimé ici : on suit, sauf si modifié là-bas
    return null;
  };
  const seen = new Set();
  r.forEach(y => { if(y && y.id && !seen.has(y.id)){ seen.add(y.id); const v = take(y.id); if(v) out.push(v); } });
  l.forEach(x => { if(x && x.id && !seen.has(x.id)){ seen.add(x.id); const v = take(x.id); if(v) out.push(v); } });
  return out;
}
/* liste de valeurs simples (noms « pour qui », questions déjà posées…) */
function mergeSet3(b, l, r){
  b = b || []; l = l || []; r = r || [];
  const added = l.filter(x => !b.includes(x)), removed = b.filter(x => !l.includes(x));
  return Array.from(new Set([...r, ...added])).filter(x => !removed.includes(x));
}
/* catégories : contenu fusionné ; l'ordre choisi ici l'emporte s'il a changé ici */
function mergeCats(b, l, r){
  const out = mergeList3(b, l, r), ids = x => (x || []).map(c => c && c.id).join('|');
  if(ids(l) !== ids(b)){
    const pos = new Map((l || []).map((c, i) => [c.id, i]));
    out.sort((x, y) => (pos.has(x.id) ? pos.get(x.id) : 1e9) - (pos.has(y.id) ? pos.get(y.id) : 1e9));
  }
  return out;
}
function mergeState(base, local, remote){
  base = base || {};
  const out = mergeObj3(base, local, remote);                // autres champs éventuels
  out.recipes  = mergeList3(base.recipes,  local.recipes,  remote.recipes);
  out.shopping = mergeList3(base.shopping, local.shopping, remote.shopping);
  out.eaters   = mergeSet3(base.eaters,    local.eaters,    remote.eaters);
  out.mealAsked = mergeSet3(base.mealAsked, local.mealAsked, remote.mealAsked);
  if(base.cats || local.cats || remote.cats) out.cats = mergeCats(base.cats, local.cats, remote.cats);
  if(base.catOf || local.catOf || remote.catOf) out.catOf = mergeObj3(base.catOf, local.catOf, remote.catOf);   // produit par produit
  if(base.ingredients || local.ingredients || remote.ingredients)
    out.ingredients = mergeSet3(base.ingredients, local.ingredients, remote.ingredients);
  const md = {}, bd = base.mealDefaults || {}, ld = local.mealDefaults || {}, rd = remote.mealDefaults || {};
  new Set([...Object.keys(bd), ...Object.keys(ld), ...Object.keys(rd)]).forEach(k => {
    const v = mergeSet3(bd[k], ld[k], rd[k]); if(v.length) md[k] = v;
  });
  out.mealDefaults = md;
  /* calendrier : jour par jour, créneau par créneau */
  const plan = {}, bp = base.plan || {}, lp = local.plan || {}, rp = remote.plan || {};
  new Set([...Object.keys(rp), ...Object.keys(lp)]).forEach(k => {
    const bd = bp[k] || {}, ld = lp[k] || {}, rd = rp[k] || {};
    const day = mergeObj3(bd, ld, rd);
    SLOTS.forEach(s => day[s.k] = mergeList3(bd[s.k], ld[s.k], rd[s.k]));
    const show = mergeObj3(bd.show, ld.show, rd.show);
    if(Object.keys(show).length) day.show = show; else delete day.show;
    plan[k] = day;
  });
  out.plan = plan;
  return out;
}
const LS_BASE = 'mesrecettes.base.';            // + nom du foyer : dernière version commune avec le serveur

/* ---------- données partagées du foyer ---------- */
const cloud = {
  on:false, foyer:'', foyers:[], timer:null, pending:false, warned:false, sending:null,
  getBase(){ try{ return JSON.parse(localStorage.getItem(LS_BASE + this.foyer)); }catch(e){ return null; } },
  setBase(d){ try{ localStorage.setItem(LS_BASE + this.foyer, JSON.stringify(d)); }catch(e){} },
  async pull(){
    const rows = await db('recettes_app?select=data&id=eq.' + encodeURIComponent(this.foyer));
    if(rows && rows.length && rows[0].data){
      state = Object.assign({ recipes:[], plan:{}, shopping:[], eaters:[] }, clone(rows[0].data));
      const fixed = migrer();
      this.setBase(rows[0].data);                // base = serveur : les corrections faites ici lui seront envoyées
      store.saveLocal();
      render();
      if(fixed) this.put();
    } else if(!(await this.flush())){       // foyer tout neuf : on y publie les données de cet appareil
      throw new Error('Envoi impossible');
    }
  },
  put(){
    clearTimeout(this.timer);
    this.pending = true;
    this.timer = setTimeout(()=> this.flush(), 700);
  },
  /* un seul envoi à la fois */
  flush(){
    clearTimeout(this.timer);
    if(!this.sending) this.sending = this._flush().finally(()=> { this.sending = null; });
    return this.sending;
  },
  async _flush(){
    if(!this.foyer) return false;
    const foyer = this.foyer;
    try{
      for(let attempt = 0; attempt < 4; attempt++){
        const local = clone(state);
        const rows = await db('recettes_app?select=data,updated_at&id=eq.' + encodeURIComponent(foyer));
        const row = rows && rows[0];
        const merged = row && row.data ? mergeState(this.getBase(), local, row.data) : local;
        const stamp = new Date().toISOString();
        if(row){
          /* n'enregistre que si personne n'a écrit entre-temps (sinon on refusionne) */
          const res = await db('recettes_app?id=eq.' + encodeURIComponent(foyer) + '&updated_at=eq.' + encodeURIComponent(row.updated_at), {
            method:'PATCH', headers:{ Prefer:'return=representation' },
            body: JSON.stringify({ data:merged, updated_at:stamp })
          });
          if(!res || !res.length) continue;
        } else {
          await db('recettes_app', {
            method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify([{ id:foyer, data:merged, updated_at:stamp }])
          });
        }
        if(this.foyer !== foyer) return true;                  // on a changé de foyer pendant l'envoi
        this.setBase(merged);
        /* modifié pendant l'envoi : on garde ces nouveautés par-dessus la version fusionnée */
        const touched = !same(state, local);
        const next = touched ? mergeState(local, state, merged) : merged;
        const changed = !same(next, state);
        state = next; const fixed = migrer(); store.saveLocal();
        if(changed || fixed) render();
        this.warned = false;
        if(touched || fixed) this.put(); else this.pending = false;
        return true;
      }
      throw new Error('Trop d’enregistrements simultanés');
    }catch(e){
      /* hors ligne : l'état local reste valable, on renverra à la prochaine occasion */
      if(!this.warned){ this.warned = true; toast('Envoi vers le cloud impossible — modifications gardées en local'); }
      return false;
    }
  },
  /* trouve le(s) foyer(s) de la personne connectée, puis charge les données */
  async start(){
    this.on = false;
    if(!auth.session){ paintAccount(); renderWeek(); return; }
    try{
      const rows = await db('foyer_membres?select=foyer_id&email=eq.' + encodeURIComponent(auth.email));
      this.foyers = Array.from(new Set((rows || []).map(r => r.foyer_id))).sort((a,b)=>a.localeCompare(b,'fr'));
      const saved = localStorage.getItem(LS_FOYER);
      const next = [saved, PREF_FOYER].find(f => f && this.foyers.includes(f)) || this.foyers[0] || '';
      const sameFoyer = next && next === this.foyer;
      this.foyer = next;
      if(!this.foyer){ paintAccount(); renderWeek(); openFoyer(); return; }
      localStorage.setItem(LS_FOYER, this.foyer);
      /* modifs faites hors ligne sur ce même foyer : on les envoie plutôt que de les écraser */
      if(this.pending && sameFoyer){ if(!(await this.flush())) throw new Error('Hors ligne'); }
      else { this.pending = false; await this.pull(); }
      this.on = true;
    }catch(e){
      if(!auth.session){ toast('Session expirée — reconnecte-toi'); openLogin(); }
      else toast('Synchronisation indisponible — données enregistrées localement');
    }
    paintAccount(); renderWeek();
    friends.load(true);                            // demandes d'amis en attente ?
  }
};

/* ---------- transfert de connexion Safari → app de l'écran d'accueil ----------
   Sur iPhone, l'app ajoutée à l'écran d'accueil ne partage pas ses données avec
   le navigateur (Safari, Chrome…), où s'ouvre le lien de l'e-mail. L'app joint donc au lien un identifiant
   secret ; le navigateur dépose la connexion sous cet identifiant (sans la garder), et
   l'app vient la chercher. Fonctions SQL : deposer_session / recuperer_session. */
const pair = {
  timer: null,
  create(){
    const cur = this.get();
    if(cur) return cur.id;                       // « Renvoyer l'e-mail » : même identifiant
    const b = new Uint8Array(32); crypto.getRandomValues(b);
    const id = Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
    localStorage.setItem(LS_PAIR, JSON.stringify({ id, t:Date.now() }));
    return id;
  },
  get(){
    try{
      const p = JSON.parse(localStorage.getItem(LS_PAIR));
      if(p && p.id && Date.now() - p.t < 15*60*1000) return p;
    }catch(e){}
    localStorage.removeItem(LS_PAIR);
    return null;
  },
  async rpc(fn, body, token){
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + (token || SUPABASE_KEY), 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json().catch(()=>null);
    if(!r.ok) throw new Error((j && j.message) || ('HTTP ' + r.status));
    return j;
  },
  /* côté app de l'écran d'accueil : la connexion est-elle arrivée ? */
  async poll(){
    const p = this.get();
    if(!p || auth.session) return false;
    let row;
    try{ row = (await this.rpc('recuperer_session', { pair:p.id }) || [])[0]; }catch(e){ return false; }
    if(!row || !row.refresh_token) return false;
    this.stop(); localStorage.removeItem(LS_PAIR);
    auth.save({ access_token:row.access_token, refresh_token:row.refresh_token, expires_at:row.expires_at });
    /* l'adresse e-mail vient du serveur, pas du jeton déposé */
    try{
      const u = await fetch(SUPABASE_URL + '/auth/v1/user', { headers:{ apikey:SUPABASE_KEY, Authorization:'Bearer ' + await auth.token() } });
      if(!u.ok) throw new Error('HTTP ' + u.status);
      auth.save(Object.assign({}, auth.session, { user: await u.json() }));
    }catch(e){ auth.save(null); toast('Connexion impossible, redemande un lien'); return false; }
    localStorage.removeItem(LS_LOCALONLY);
    closeModal(); toast('Connecté·e');
    await cloud.start();
    return true;
  },
  /* vérifie régulièrement tant que l'écran « Vérifie tes e-mails » est ouvert */
  watch(){
    this.stop();
    this.timer = setInterval(()=>{
      if(!$('#pairWait') || auth.session){ this.stop(); return; }
      if(document.visibilityState === 'visible') this.poll();
    }, 3000);
  },
  stop(){ clearInterval(this.timer); this.timer = null; },
  /* côté Safari : dépose la connexion pour l'app, sans la garder ici */
  async handOff(id){
    history.replaceState(null, '', location.pathname + location.hash);   // retire ?pair= de l'adresse
    let msg;
    try{
      const s = await auth.fromUrl(false);
      if(!s) throw new Error('Lien incomplet');
      await this.rpc('deposer_session', {
        pair:id, jeton:s.access_token, jeton_refresh:s.refresh_token,
        expire: Number(s.expires_at) || (Math.floor(Date.now()/1000) + (Number(s.expires_in) || 3600))
      }, s.access_token);
      /* surtout pas de déconnexion ici : elle couperait aussi la connexion transmise */
      msg = `<h2>C’est tout bon&nbsp;!</h2>
        <div class="muted">Retourne dans l’app <b>Mes Recettes</b> de ton écran d’accueil : tu y seras connecté·e automatiquement.<br><br>Tu peux fermer cette page.</div>`;
    }catch(e){
      msg = `<h2>Lien expiré</h2>
        <div class="muted">Ce lien de connexion est invalide, expiré ou a déjà servi.<br><br>Retourne dans l’app <b>Mes Recettes</b> de ton écran d’accueil et demande un nouveau lien.</div>`;
    }
    paintAccount();
    openModal(msg + `<div class="foot"><button class="btn ghost" data-act="closemodal">Fermer</button></div>`);
  }
};

async function initCloud(){
  if(!CLOUD_OK) return;                         // pas de Supabase configuré : 100 % local
  $('#acctBtn').hidden = false;
  auth.load();
  /* lien ouvert dans Safari alors qu'il a été demandé depuis l'app de l'écran d'accueil */
  const pairId = new URLSearchParams(location.search).get('pair');
  if(pairId){
    if(auth.session) await cloud.start();         // Safari avait déjà sa propre connexion : on la garde
    await pair.handOff(pairId);
    return;
  }
  let linkErr = '';
  try{
    if(await auth.fromUrl()){ localStorage.removeItem(LS_LOCALONLY); toast('Connecté·e'); }
  }catch(e){
    linkErr = 'Ce lien de connexion est invalide, expiré ou a déjà servi. Demande un nouveau lien ci-dessous.';
  }
  if(!auth.session && await pair.poll()) return;   // connexion transmise pendant que l'app était fermée
  if(auth.session) await cloud.start();
  else{
    paintAccount();
    if(linkErr || localStorage.getItem(LS_LOCALONLY) !== '1') openLogin('', linkErr);
  }
  /* retour sur l'app (autre onglet, téléphone déverrouillé…) : on envoie nos
     modifs en attente, puis on récupère celles des autres membres du foyer */
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'hidden'){ if(cloud.on && cloud.pending) cloud.flush(); return; }
    if(!auth.session){                          // connecté entre-temps dans un autre onglet (lien de l'e-mail)
      auth.load();
      if(auth.session){ closeModal(); await cloud.start(); }
      else await pair.poll();                   // ou via Safari, pour l'app de l'écran d'accueil
      return;
    }
    friends.load();
    if(!cloud.on){ await cloud.start(); return; }
    if(cloud.pending) await cloud.flush();
    if(!cloud.pending && !$('#modal').classList.contains('on')){
      try{ await cloud.pull(); }catch(e){}
    }
  });
  window.addEventListener('storage', async e=>{
    if(e.key === LS_SESSION){
      auth.load();
      if(auth.session && !cloud.on){ closeModal(); await cloud.start(); }
      else if(!auth.session && cloud.on){ cloud.on = false; paintSync(); }   // déconnecté dans un autre onglet
    }
  });
}

/* ---- recettes des amis ---- */
let frCache = null;                            // [{ ami, r }] : recettes reçues du serveur
const frFilter = { q:'', who:'' };
const importedFrom = (ami, id) => state.recipes.some(x => x.origin && x.origin.email === ami && x.origin.id === id);
/* empreinte du contenu d'une recette (mêmes normalisations que le formulaire) :
   sert à savoir si un ami a modifié la recette qu'il a importée.
   Les étiquettes sont propres à chacun : elles ne font pas partie de la recette */
const sigParts = r => [String(r.name || '').trim(), Number(r.duration) || 0, Number(r.servings) || 0, String(r.url || ''),
  (Array.isArray(r.ingredients) ? r.ingredients : []).filter(i => i && i.name)
    .map(i => [String(i.name).trim(), Number(i.qty) > 0 ? Number(i.qty) : 0, String(i.unit || '')]),
  String(r.steps || '').replace(/\s+$/, '')];
const recSig = r => 'v2:' + JSON.stringify(sigParts(r));
/* empreintes des premiers imports (sans préfixe) : elles comptaient encore les étiquettes */
const recSigV1 = r => JSON.stringify(sigParts(r).concat([
  Array.from(new Set((Array.isArray(r.tags) ? r.tags : []).map(t => String(t).trim()).filter(Boolean)))]));
const sigChanged = (r, sig) => sig.startsWith('v2:') ? recSig(r) !== sig : recSigV1(r) !== sig;
/* recette d'origine d'une copie, même après plusieurs imports successifs (moi → A → B) */
const rootOf = r => r.origin && typeof r.origin === 'object' ? String(r.origin.root || r.origin.id || '') : String(r.id || '');
/* une copie qu'un ami a faite d'une recette que j'ai déjà (la mienne, ou une que j'ai importée)
   ou dont l'original est déjà dans la liste de mes amis : masquée, sauf s'il l'a modifiée depuis son import */
function friendCopyState(r){
  if(!r.origin || typeof r.origin !== 'object') return '';
  const root = rootOf(r);
  const mine = state.recipes.find(x => x.id === root);
  const orig = mine || (frCache || []).map(x => x.r).find(x => x !== r && String(x.id) === root && !x.origin);
  if(!orig && !state.recipes.some(x => x.origin && rootOf(x) === root)) return '';
  const changed = typeof r.origin.sig === 'string' ? sigChanged(r, r.origin.sig)
                : orig ? recSig(r) !== recSig(orig) : false;    // copie faite avant l'empreinte : comparée à l'original
  return changed ? (mine ? 'mine-changed' : 'changed') : 'hide';
}

/* copie « propre » d'une recette d'ami (données venant d'un autre compte) */
function cleanFriendRecipe(r, ami){
  const ings = (Array.isArray(r.ingredients) ? r.ingredients : []).filter(i => i && i.name).map(i => ({
    name: ingFind(i.name) || String(i.name).slice(0, 120), qty: Number(i.qty) > 0 ? Number(i.qty) : '',
    unit: UNITS.some(u => u.k === i.unit) ? i.unit : ''
  }));
  const c = {
    id:uid(), name:String(r.name).slice(0, 200), duration: Number(r.duration) > 0 ? Math.round(Number(r.duration)) : 30,
    servings: Number(r.servings) > 0 ? Math.round(Number(r.servings)) : null, url: safeUrl(r.url) || '',
    tags: [],                                  // les étiquettes de l'ami restent les siennes
    ingredients: ings, steps: typeof r.steps === 'string' ? r.steps.slice(0, 20000) : '', origin: { email:ami, id:String(r.id), root: rootOf(r).slice(0, 100) }
  };
  c.origin.sig = recSig(c);                    // pour reconnaître plus tard une copie modifiée
  return c;
}
function openFriendRecipe(i){

  openModal(`

    <div class="origin">👤 Recette de ${whoInline(x.ami)}${{ 'mine-changed':' · version modifiée de ta recette', changed:' · version modifiée' }[friendCopyState(r)] || ''}</div>

async function createFoyer(nom){
  const from = cloud.foyer;
  if(from && cloud.pending && !(await cloud.flush())) throw new Error('hors ligne, réessaie une fois connecté·e');
  await db('rpc/creer_foyer', { method:'POST', body:JSON.stringify({ nom }) });
  const copy = confirm(from
    ? 'Copier les recettes de « ' + from + ' » dans « ' + nom + ' » ?\n(Annuler = foyer vide)'
    : 'Copier dans « ' + nom + ' » les recettes déjà présentes sur cet appareil ?\n(Annuler = foyer vide)');
  /* depuis un autre foyer, on ne reprend que les recettes (pas son calendrier ni ses courses) */
  if(!copy) state = EMPTY();
  else if(from) state = Object.assign(EMPTY(), { recipes:state.recipes, eaters:state.eaters });
  store.saveLocal(); render();
  cloud.on = false; cloud.pending = false;
  localStorage.setItem(LS_FOYER, nom);

  closeModal(); toast('Foyer « ' + nom + ' » créé');

/* ============================================================
   OUTILS "RECETTES DANS LE PLAN"
   ============================================================ */
/* ---- repas affichés (coches « Midi » / « Soir ») ----
   state.mealDefaults : réglage par défaut par jour de la semaine, ex. { "2": ["midi"] }
                        = pas de midi le mercredi (0 = lundi … 6 = dimanche)
   plan[date].show    : exception pour une date précise, ex. { midi:true }
   state.mealAsked    : questions « tous les mercredis ? » déjà posées, ex. ["2-midi"]
   Un créneau qui contient un plat reste toujours affiché. */
const weekdayOf = key => (new Date(key + 'T12:00:00').getDay() + 6) % 7;
function defaultOff(wd, k){ return ((state.mealDefaults || {})[wd] || []).includes(k); }
function slotOff(dateKey, k){
  const day = state.plan[dateKey] || {};
  if((day[k] || []).length) return false;
  if(day.show && k in day.show) return !day.show[k];
  return defaultOff(weekdayOf(dateKey), k);
}
function setDefaultOff(wd, k, off){
  const d = state.mealDefaults = state.mealDefaults || {};
  const set = new Set(d[wd] || []);
  off ? set.add(k) : set.delete(k);
  if(set.size) d[wd] = Array.from(set); else delete d[wd];
}
function setDayShow(key, k, on){                // on = null : suit le réglage par défaut
  const day = state.plan[key] = state.plan[key] || { midi:[], soir:[] };
  const show = Object.assign({}, day.show);
  if(on === null) delete show[k]; else show[k] = on;
  if(Object.keys(show).length) day.show = show; else delete day.show;
}
function markAsked(wd, k){
  const a = new Set(state.mealAsked || []); a.add(wd + '-' + k); state.mealAsked = Array.from(a);
}
function recipesOfDay(dateKey){
  const day = state.plan[dateKey] || {};
  return SLOTS.flatMap(s => (day[s.k]||[]));
}
function recipesOfWeek(anchor){
  return weekDates(anchor).flatMap(d => recipesOfDay(isoOf(d)));
}
function findRecipe(id){ return state.recipes.find(r => r.id === id); }
/* un plat du plan est un id (ancien format) ou { id, who } */
function eidOf(e){ return typeof e === 'string' ? e : (e && e.id); }
/* convertit les anciens plats (id nu, ou entrée sans id) au format { id, who } */
function migrer(){
  let changed = false;
  Object.keys(state.plan).forEach(k=>{
    const day = state.plan[k] || {};
    SLOTS.forEach(s=>{
      const list = day[s.k];
      if(Array.isArray(list)){
        const clean = list.map(e=>{
          if(typeof e === 'string'){ changed = true; return { id:e, who:'' }; }
          if(e && e.id) return { id:e.id, who:e.who||'' };
          changed = true; return null;
        }).filter(Boolean);
        day[s.k] = clean;
      } else {
        day[s.k] = [];
      }
    });
    if(Array.isArray(day.off)){                    // ancien format des coches → exceptions « show »
      day.show = Object.assign({}, day.show); day.off.forEach(x => day.show[x] = false);
      delete day.off; changed = true;
    }
    state.plan[k] = day;
  });
  if(ingHarmonize()) changed = true;             // écritures d'ingrédients ramenées à celles de la liste
  if(changed) localStorage.setItem(LS, JSON.stringify(state));
  return changed;
}

   RENDU — CALENDRIER
   ============================================================ */
function renderWeek(){
  const dates = weekDates(ANCHOR);
  const { week, year } = isoWeek(ANCHOR);
  $('#wLabel').textContent = 'Semaine ' + week;
  $('#wRange').textContent = year + ' · du ' + fmtDate(dates[0]) + ' au ' + fmtDate(dates[6]);

  const total = dates.reduce((n,d)=> n + recipesOfDay(isoOf(d)).length, 0);
  const el = $('#wCount');
  el.className = 'pill' + (cloud.on ? ' cloud' : '');
  el.textContent = cloud.on
    ? total + (total>1?' plats · synchronisé':' plat · synchronisé')
    : total + (total>1?' plats':' plat') + ' · local';

  const todayKey = isoOf(new Date());
  $('#weekDays').innerHTML = dates.map(d=>{
    const key = isoOf(d);
    const day = state.plan[key] || {};
    const isToday = key === todayKey;
    const isPast = key < todayKey;                 // dates ISO : l'ordre alphabétique est l'ordre chronologique
    const shownSlots = SLOTS.filter(s => !slotOff(key, s.k));
    const slots = !shownSlots.length ? '<div class="slot-none">Pas de repas prévu ce jour-là</div>' : shownSlots.map(s=>{
      const list = day[s.k] || [];
      return `
        <div class="slot">
          <div class="slot-t">${s.l}</div>
          ${list.map(entry=>{
            const id = eidOf(entry);
            const r = findRecipe(id);
            if(!r) return '';
            const tags = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
            /* tout le post-it ouvre la fiche ; × retire le plat */
            return `<div class="chip" data-act="openrec" data-id="${id}" role="button" aria-label="Voir la recette ${esc(r.name)}">
              <div class="nm">${esc(r.name)}<span class="go" aria-hidden="true">›</span>${tags?`<div class="tags">${tags}</div>`:''}
              </div>
              <button class="x" data-act="unplan" data-date="${key}" data-slot="${s.k}" data-id="${id}" aria-label="Retirer">×</button>
            </div>`;
          }).join('')}
          ${isPast ? (list.length ? '' : '<div class="slot-none">—</div>') : `<button class="addmini" data-act="plan" data-date="${key}" data-slot="${s.k}">+ Ajouter une recette</button>`}
        </div>`;
    }).join('');
    return `<div class="day${isToday?' today':''}${isPast?' past':''}">
      <div class="day-h">
        <span class="dname">${DAYS[(d.getDay()+6)%7]}</span>
        <span class="dnum">${fmtDate(d)}</span>
        ${isToday?'<span class="badge">Aujourd’hui</span>':''}
        ${isPast ? '' : `<span class="slotsw">${SLOTS.map(s => { const on = !slotOff(key, s.k);
          return `<button class="sw${on?' on':''}" data-act="slotsw" data-date="${key}" data-slot="${s.k}" aria-pressed="${on}" aria-label="Afficher le ${s.l.toLowerCase()}"><span class="sw-box">${on?'✓':''}</span>${s.l}</button>`; }).join('')}</span>`}
      </div>
      <div class="slots">${slots}</div>
    </div>`;
  }).join('');
}

/* amène le bloc du jour en haut de l'écran (s'il est dans la semaine affichée) */
let userScrolled = false;                      // la personne a fait défiler elle-même : on ne bouge plus
function scrollToToday(smooth){
  const el = $('#v-cal.on .day.today');
  if(el) weekBar.hideFor(smooth ? 900 : 150);
  if(el) el.scrollIntoView({ block:'start', behavior: smooth ? 'smooth' : 'auto' });
  else if(smooth) window.scrollTo({ top:0, behavior:'smooth' });
}
['touchmove','wheel','keydown'].forEach(ev => addEventListener(ev, ()=>{ userScrolled = true; }, { once:true, passive:true }));

/* bloc des semaines : visible en haut de page, caché en descendant, rappelé en remontant */
const weekBar = {
  lastY: 0, travel: 0, quietUntil: 0, hdr: 70,
  measure(){ this.hdr = $('header.app').offsetHeight; document.documentElement.style.setProperty('--hdr', this.hdr + 'px'); },
  onScroll(){
    /* bloc du haut de l'onglet affiché (semaines, ou recherche des recettes) */
    const view = $('.view.on'), bar = view && view.querySelector('.stickybar');
    if(!bar) return;
    const y = Math.max(0, window.scrollY);            // ignore le rebond élastique d'iOS
    const dy = y - this.lastY; this.lastY = y;
    /* le bloc « colle » sous l'en-tête dès que sa place normale passe dessous */
    const stuck = y > view.offsetTop - this.hdr + 1;
    bar.classList.toggle('stuck', stuck);
    if(!stuck){ bar.classList.remove('away'); this.travel = 0; return; }
    if(Date.now() < this.quietUntil){ bar.classList.add('away'); return; }
    /* on attend un petit déplacement dans le même sens pour éviter le clignotement */
    this.travel = (Math.sign(dy) === Math.sign(this.travel)) ? this.travel + dy : dy;
    if(this.travel > 12) bar.classList.add('away');
    else if(this.travel < -12) bar.classList.remove('away');
  },
  /* défilement automatique (ex. vers le jour actuel) : le bloc reste caché */
  hideFor(ms){ this.quietUntil = Date.now() + ms; $('#weekBar').classList.add('away'); }
};
weekBar.measure();
addEventListener('resize', ()=> weekBar.measure());
addEventListener('scroll', ()=> weekBar.onScroll(), { passive:true });

/* étiquettes limitées à 2 lignes ; au-delà, bouton « Voir toutes les étiquettes » */
function clampTags(){
  const box = $('#recTags'), more = $('#moreTags');
  const chips = Array.from(box.children);
  chips.forEach(c => c.hidden = false);
  if(!$('#v-rec').classList.contains('on') || !chips.length){ more.hidden = true; return; }   // mesuré à l'affichage de l'onglet
  const rows = Array.from(new Set(chips.map(c => c.offsetTop))).sort((a,b)=>a-b);
  if(rows.length <= 2){ more.hidden = true; return; }
  const hidden = chips.filter(c => c.offsetTop > rows[1]);
  hidden.forEach(c => c.hidden = true);
  more.textContent = 'Voir toutes les étiquettes (+' + hidden.length + ')';
  more.hidden = false;
}

function renderWeekSelect(force){
  const { week, year } = isoWeek(ANCHOR);
  const sel = $('#impWeek');
  /* garde la semaine choisie dans « Courses » tant que le calendrier n'a pas changé de semaine */
  if(!force && selAnchor === year + '-' + week && sel.value) return;
  selAnchor = year + '-' + week;
  if(selYear !== year){                        // reconstruit si on a changé d'année
    const opts = [];
    for(let y = year-1; y <= year+1; y++){
      for(let w = 1; w <= weeksInYear(y); w++){
        const mon = mondayOfWeek(y,w);
        opts.push(`<option value="${y}-${w}">Semaine ${w} — ${y} · du ${fmtDate(mon)} au ${fmtDate(addDays(mon,6))}</option>`);

/* recettes (uniques) et ingrédients regroupés d'une semaine ISO */
/* recettes décochées dans l'import (remises à zéro quand on change de semaine) */
const impOff = new Set(); let impWeekKey = '';
function weekIngredients(y, w){
  const mon = mondayOfWeek(y,w);
  const dates = DAYS.map((_,i)=> addDays(mon,i));
  const ids = dates.flatMap(d => recipesOfDay(isoOf(d)).map(eidOf));
  const recipes = Array.from(new Set(ids)).map(findRecipe).filter(Boolean);
  const chosen = recipes.filter(r => !impOff.has(r.id));
  const groups = {};
  chosen.forEach(r => (r.ingredients||[]).forEach(i=>{
    const unit = i.unit || '';
    const k = i.name.trim().toLowerCase() + '|' + unit;     // 200 g et 1 botte ne s'additionnent pas
    if(!groups[k]) groups[k] = { name:i.name.trim(), qty:0, unit, src:new Set() };
    groups[k].qty = Math.round((groups[k].qty + (Number(i.qty)||0)) * 100) / 100;
    groups[k].src.add(r.name);
  }));
  const keys = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'fr'));
  return { recipes, chosen, groups, keys };
}
function renderImport(){
  const v = $('#impWeek').value; if(!v) return;
  if(v !== impWeekKey){ impOff.clear(); impWeekKey = v; }
  const [y,w] = v.split('-').map(Number);
  const { recipes:uniq, chosen, groups, keys } = weekIngredients(y, w);

  if(!uniq.length){
    $('#impPreview').innerHTML = `<div class="empty" style="padding:16px">Aucune recette programmée cette semaine-là.</div>`;
    return;

/* ---- fermer une fenêtre en la faisant glisser vers le bas ----
   depuis la poignée / le haut de la fenêtre, ou n'importe où quand son
   contenu est déjà tout en haut (comme les fenêtres des apps iPhone) */
(function(){
  const sh = $('#sheet'), modal = $('#modal');
  let y0 = 0, x0 = 0, dy = 0, mode = '';                // mode : '' (à décider), 'drag', 'scroll'
  let vy = 0, lastY = 0, lastT = 0;                      // élan du doigt au moment du lâcher (px/ms)
  sh.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    y0 = lastY = t.clientY; x0 = t.clientX; lastT = Date.now(); dy = 0; vy = 0;
    const onTop = t.clientY - sh.getBoundingClientRect().top < 56;   // poignée + titre
    mode = (onTop || sh.scrollTop <= 0) ? '' : 'scroll';
  }, { passive:true });
  sh.addEventListener('touchmove', e=>{
    if(mode === 'scroll' || e.touches.length !== 1) return;
    const t = e.touches[0];
    dy = t.clientY - y0;
    if(mode === ''){
      if(Math.abs(dy) < 6 && Math.abs(t.clientX - x0) < 6) return;
      /* vers le bas et plutôt vertical : on tire la fenêtre ; sinon on laisse défiler */
      mode = (dy > 0 && Math.abs(dy) > Math.abs(t.clientX - x0)) ? 'drag' : 'scroll';
      if(mode === 'scroll') return;
      sh.classList.add('dragging');
      if(document.activeElement && sh.contains(document.activeElement)) document.activeElement.blur();
    }
    e.preventDefault();
    const now = Date.now();
    if(now > lastT){ vy = (t.clientY - lastY) / (now - lastT); lastY = t.clientY; lastT = now; }
    const d = Math.max(0, dy);
    sh.style.transform = 'translateY(' + d + 'px)';
    modal.style.background = 'rgba(39,50,74,' + (0.38 * Math.max(0, 1 - d / sh.offsetHeight)).toFixed(3) + ')';
  }, { passive:false });
  const end = ()=>{
    if(mode !== 'drag'){ mode = ''; return; }
    mode = '';
    sh.classList.remove('dragging'); sh.classList.add('settle');
    /* assez tirée vers le bas, ou lâchée avec de l'élan vers le bas */
    if(dy > Math.min(140, sh.offsetHeight * 0.3) || (dy > 30 && vy > 0.5)){
      sh.style.transform = 'translateY(100%)'; modal.style.background = 'rgba(39,50,74,0)';
      setTimeout(()=>{ closeModal(); sh.classList.remove('settle'); sh.style.transform = ''; modal.style.background = ''; }, 200);
    } else {
      sh.style.transform = ''; modal.style.background = '';
      setTimeout(()=> sh.classList.remove('settle'), 230);
    }
  };
  sh.addEventListener('touchend', end);
  sh.addEventListener('touchcancel', end);
})();

/* lien vers la recette d'origine : uniquement des adresses web (http/https),
   « marmiton.org/… » est complété en « https://marmiton.org/… » ; null si invalide */
function safeUrl(v){
  v = String(v || '').trim();
  if(!v) return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(v)) v = 'https://' + v;
  try{
    const u = new URL(v);
    return (u.protocol === 'http:' || u.protocol === 'https:') && u.hostname.includes('.') ? u.href : null;
  }catch(e){ return null; }
}
const siteOf = url => { try{ return new URL(url).hostname.replace(/^www\./, ''); }catch(e){ return url; } };

const ingKey = n => String(n || '').trim().toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae')

function ingredientStats(){
  const counts = new Map(), names = new Map();

    if(!names.has(k)) names.set(k, i.name.trim());
    const c = counts.get(k) || {}; const u = i.unit || '';
    c[u] = (c[u] || 0) + 1; counts.set(k, c);
  }
  const unit = new Map();
  counts.forEach((c, k) => unit.set(k, Object.keys(c).reduce((a, b) => c[b] > c[a] ? b : a)));
  return { unit, names:Array.from(names.values()).sort((a,b)=>a.localeCompare(b,'fr')) };
}

const ING_CATALOG = ING_SECTIONS.flatMap(x => x[1].split('|'));
/* clés de comparaison, au singulier, apostrophes et tirets comme des espaces :
   - accentKey garde les accents : c'est l'identité d'un ingrédient (« Pâte » ≠ « Pâté »)
   - matchKey les ignore : pour retrouver « pates » ou « creme fraiche » */
const ingSingular = w => w.length > 3 && /[sx]$/.test(w) ? w.slice(0, -1) : w;
const matchKey = n => ingKey(n).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').map(ingSingular).join(' ');
const ingLower = n => String(n || '').trim().toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFC');
const accentKey = n => ingLower(n).replace(/[^a-z0-9à-ÿ]+/g, ' ').trim().split(' ').map(ingSingular).join(' ');
const hasAccent = n => /[à-ÿ]/.test(ingLower(n));
/* recherche tolérante : sans accents ni majuscules, « tomates » trouve « Tomate » */
const textHit = (value, q) => { const a = ingKey(q); if(!a) return true;
  return ingKey(value).includes(a) || matchKey(value).includes(matchKey(q)); };
/* écriture propre d'un nouvel ingrédient : espaces nettoyés, majuscule au début */
function ingTidy(s){
  s = String(s || '').replace(/['`]/g, '’').replace(/\s+/g, ' ').trim();
  if(s === s.toUpperCase()) s = s.toLowerCase();                 // « TOMATE » → « tomate »
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* toutes les entrées de la liste : catalogue d'abord (il l'emporte), puis ajouts du foyer.
   Index recalculé seulement quand la liste du foyer change */
let ingIdx = { sig:null };
function ingIndex(){
  const custom = Array.isArray(state.ingredients) ? state.ingredients : [];
  const sig = JSON.stringify(custom);
  if(ingIdx.sig === sig) return ingIdx;
  const seen = new Set(), entries = [], byLoose = new Map();
  const add = (name, custom) => { const key = accentKey(name); if(!key || seen.has(key)) return; seen.add(key);
    const e = { name, key, loose:matchKey(name), plain:ingKey(name), custom }; entries.push(e);
    if(!byLoose.has(e.loose)) byLoose.set(e.loose, []);
    byLoose.get(e.loose).push(e); };
  ING_CATALOG.forEach(n => add(n, false));
  custom.forEach(n => typeof n === 'string' && add(n, true));
  return ingIdx = { sig, entries, byLoose };
}
const ingEntries = () => ingIndex().entries;
/* l'ingrédient de la liste qui correspond à une écriture, s'il n'y a pas d'ambiguïté :
   avec des accents, ils doivent correspondre ; sans accent, une seule possibilité */
function ingFind(name){
  const c = ingIndex().byLoose.get(matchKey(name)) || [];
  if(!c.length) return null;
  const k = accentKey(name), same = c.find(e => e.key === k);
  if(same) return same.name;
  return !hasAccent(name) && c.length === 1 ? c[0].name : null;
}
/* nombre de recettes utilisant chaque écriture d'ingrédient */
function ingUsage(){
  const m = new Map();
  state.recipes.forEach(r => new Set((r.ingredients || []).filter(i => i && i.name).map(i => i.name))
    .forEach(n => m.set(n, (m.get(n) || 0) + 1)));
  return m;
}
/* ingrédients de mes recettes qui ne sont pas dans la liste */
function ingUnknown(){
  return Array.from(ingUsage()).filter(([n]) => !ingFind(n))
    .map(([name, count]) => ({ name, count })).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
}
/* renomme des ingrédients dans les recettes. Ce n'est pas une modification de la recette :
   une copie importée et encore identique à l'original garde une empreinte à jour */
function ingRename(fn){
  let n = 0;
  state.recipes.forEach(r => {
    if(!Array.isArray(r.ingredients)) return;
    const sig = r.origin && typeof r.origin === 'object' && typeof r.origin.sig === 'string' ? r.origin.sig : null;
    const intact = sig !== null && !sigChanged(r, sig);
    let ch = false;
    r.ingredients.forEach(i => { if(!i || !i.name) return; const to = fn(i.name); if(to && to !== i.name){ i.name = to; ch = true; } });
    if(ch){ n++; if(intact) r.origin.sig = recSig(r); }
  });
  return n;
}
/* harmonisation automatique : écritures qui correspondent sans ambiguïté à un ingrédient de la liste */
function ingHarmonize(){
  let changed = false;
  if(Array.isArray(state.ingredients)){                          // ajouts du foyer : sans doublon ni entrée du catalogue
    const cat = new Set(ING_CATALOG.map(accentKey)), seen = new Set();
    const clean = state.ingredients.filter(n => { if(typeof n !== 'string') return false; const k = accentKey(n);
      if(!k || cat.has(k) || seen.has(k)) return false; seen.add(k); return true; });
    if(clean.length !== state.ingredients.length){ state.ingredients = clean; changed = true; }
  }
  if(ingRename(ingFind)) changed = true;
  return changed;
}
/* ajoute un ingrédient manquant (une seule fois) ; renvoie son nom dans la liste,
   ou null si l'écriture sans accent peut désigner plusieurs ingrédients existants */
function ingAdd(raw){
  const name = ingTidy(raw); if(!name) return '';
  const exist = ingFind(name);
  if(exist) return exist;
  if(!hasAccent(name) && ingIndex().byLoose.has(matchKey(name))) return null;
  state.ingredients = (Array.isArray(state.ingredients) ? state.ingredients : []).concat(name)
    .sort((a, b) => a.localeCompare(b, 'fr'));
  store.save();
  return name;
}
/* distance d'édition (pour « tu voulais dire… ? ») */
function editDist(a, b){
  const d = Array.from({ length:b.length + 1 }, (_, j) => j);
  for(let i = 1; i <= a.length; i++){
    let prev = d[0]; d[0] = i;
    for(let j = 1; j <= b.length; j++){ const t = d[j]; d[j] = Math.min(d[j] + 1, d[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
/* résultats de l'autocomplétion, les plus pertinents d'abord */
function ingSearch(q, limit = 8){
  const p = ingKey(q).replace(/[^a-z0-9]+/g, ' ').trim(), mk = matchKey(q);
  if(!p) return [];
  const use = ingUsage(), used = new Map();
  use.forEach((c, n) => used.set(matchKey(n), (used.get(matchKey(n)) || 0) + c));
  return ingEntries().map(e => {
    const plain = e.plain.replace(/[^a-z0-9]+/g, ' ');
    const s = e.loose === mk ? 0 : plain.startsWith(p) ? 1 : plain.split(' ').some(w => w.startsWith(p)) ? 2
            : plain.includes(p) || e.loose.includes(mk) ? 3 : 9;
    return { e, s, u:used.get(e.key) || 0 };
  }).filter(x => x.s < 9)
    .sort((a, b) => a.s - b.s || b.u - a.u || a.e.name.length - b.e.name.length || a.e.name.localeCompare(b.e.name, 'fr'))
    .slice(0, limit).map(x => x.e);
}
/* ingrédients proches d'un nom à ajouter (faute de frappe, autre écriture) */
function ingSimilar(name){
  const k = matchKey(name); if(k.length < 3) return [];
  return ingEntries().map(e => ({ e, d:editDist(e.loose, k) }))
    .filter(x => x.d <= (k.length > 6 ? 2 : 1) || (k.length > 3 && (x.e.loose.startsWith(k + ' ') || k.startsWith(x.e.loose + ' '))))
    .sort((a, b) => a.d - b.d).slice(0, 4).map(x => x.e.name);
}

/* ---- champ « ingrédient » avec autocomplétion : on doit choisir dans la liste (ou y ajouter) ---- */
const ingAuto = {
  input:null, drop:null, onPick:null, items:[], hi:0,
  attach(input, onPick){
    input.setAttribute('autocomplete', 'off'); input.setAttribute('autocorrect', 'off');
    input.addEventListener('focus', () => this.open(input, onPick));
    input.addEventListener('input', () => { if(this.input !== input) this.open(input, onPick); else this.paint(); });
    input.addEventListener('keydown', e => this.key(e));
    input.addEventListener('blur', () => setTimeout(() => {
      if(this.input !== input || (this.drop && this.drop.contains(document.activeElement))) return;
      this.close(true);
    }, 160));
  },
  open(input, onPick){
    if(this.input && this.input !== input) this.close(true);
    this.input = input; this.onPick = onPick;
    if(!this.drop){
      this.drop = document.createElement('div'); this.drop.className = 'ingdrop';
      /* empêche l'input de perdre le focus quand on touche une proposition */
      this.drop.addEventListener('pointerdown', e => { if(!e.target.closest('input')) e.preventDefault(); });
      this.drop.addEventListener('click', e => this.click(e));
    }
    const anchor = input.closest('.ingline') || input;
    anchor.after(this.drop);
    this.paint();
  },
  paint(){
    if(!this.input || !this.drop) return;
    /* champ vide de l'écran « à harmoniser » : propositions pour l'écriture à remplacer */
    const v = this.input.value.trim() || this.input.dataset.seed || '';
    this.items = ingSearch(v);
    const exact = v && !!ingFind(v);
    this.hi = 0;
    this.drop.innerHTML = !v
      ? '<div class="ingdrop-hint">Tape le début du nom de l’ingrédient…</div>'
      : this.items.map((e, i) => `<button type="button" class="ingopt${i === 0 ? ' hi' : ''}" data-i="${i}">${esc(e.name)}${e.custom ? '<small>ajouté par ton foyer</small>' : ''}</button>`).join('') +
        (exact ? '' : `<button type="button" class="ingopt add" data-add="1">＋ Ajouter « ${esc(ingTidy(v))} » à la liste</button>`);
  },
  key(e){
    if(!this.drop || !this.drop.isConnected) return;
    const opts = Array.from(this.drop.querySelectorAll('.ingopt'));
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if(!opts.length) return;
      this.hi = (this.hi + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.classList.toggle('hi', i === this.hi));
    } else if(e.key === 'Enter'){
      e.preventDefault(); if(opts[this.hi]) opts[this.hi].click();
    } else if(e.key === 'Escape'){ this.close(true); }
  },
  click(e){
    const o = e.target.closest('button'); if(!o) return;
    if(o.dataset.i !== undefined) return this.pick(this.items[+o.dataset.i].name);
    if(o.dataset.add) return this.addForm();
    if(o.dataset.sim) return this.pick(o.dataset.sim);
    if(o.dataset.addok){ const n = this.drop.querySelector('#ingNew').value; if(!ingTidy(n)) return;
      const before = ingFind(n), name = ingAdd(n);
      if(name === null){ toast('Précise l’orthographe (avec les accents) ou choisis un ingrédient proposé'); return; }
      toast(before ? '« ' + name + ' » existe déjà dans la liste' : '« ' + name + ' » ajouté à la liste');
      return this.pick(name); }
    if(o.dataset.addcancel){ this.input.focus(); this.paint(); }
  },
  /* ajout d'un ingrédient manquant : écriture à vérifier, proches existants proposés */
  addForm(){
    const v = ingTidy(this.input.value.trim() || this.input.dataset.seed || '');
    const sim = ingSimilar(v);
    this.drop.innerHTML = `<div class="ingadd">
      <b>Nouvel ingrédient</b>
      <input type="text" id="ingNew" value="${esc(v)}" autocomplete="off" maxlength="60">
      <div class="muted">Vérifie l’orthographe : <b>au singulier</b>, avec les <b>accents</b>, majuscule au début. Il sera proposé à tout ton foyer.</div>
      ${sim.length ? `<div class="ingsim">Tu voulais peut-être dire : ${sim.map(n => `<button type="button" class="tag" data-sim="${esc(n)}">${esc(n)}</button>`).join(' ')}</div>` : ''}
      <div class="row" style="gap:6px;margin-top:8px"><button type="button" class="btn ghost sm" data-addcancel="1" style="flex:1">Annuler</button>
        <button type="button" class="btn sm" data-addok="1" style="flex:1">Ajouter</button></div></div>`;
    const ni = this.drop.querySelector('#ingNew');
    ni.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); this.drop.querySelector('[data-addok]').click(); } });
    ni.addEventListener('blur', () => setTimeout(() => {
      if(this.drop && !this.drop.contains(document.activeElement) && document.activeElement !== this.input) this.close(true);
    }, 160));
    ni.focus(); ni.select();
  },
  pick(name){
    const input = this.input, cb = this.onPick;
    input.value = name; input.classList.remove('bad');
    this.close(false);
    if(cb) cb(name, input);
  },
  /* fermeture : une écriture qui correspond à un ingrédient de la liste est corrigée d'office */
  close(check){
    const input = this.input; this.input = null;
    if(this.drop) this.drop.remove();
    if(check && input && input.isConnected){
      const v = input.value.trim(), k = ingFind(v);
      if(k){ if(k !== input.value) this.pickSilent(input, k); input.classList.remove('bad'); }
      else if(input.classList.contains('i-name')) input.classList.toggle('bad', !!v);
    }
  },
  pickSilent(input, name){ input.value = name; input.dispatchEvent(new Event('ingpicked', { bubbles:true })); }
};

/* ---- écran « Ingrédients » : à harmoniser + ajouts du foyer ---- */
function openIngredients(){
  openModal(`<h2>Ingrédients</h2><div id="ingBody"></div>
    <div class="foot"><button class="btn ghost" data-act="closemodal">Fermer</button></div>`);
  paintIngredients();
}
function paintIngredients(){
  const b = $('#ingBody'); if(!b) return;
  const unknown = ingUnknown(), use = ingUsage();
  const custom = (Array.isArray(state.ingredients) ? state.ingredients : []).slice().sort((a, b) => a.localeCompare(b, 'fr'));
  const nUse = n => use.get(n) || 0;
  b.innerHTML = `
    <div class="muted">Les ingrédients se choisissent dans une liste commune : ${ING_CATALOG.length} ingrédients courants, plus ceux ajoutés par ton foyer.</div>
    ${unknown.length ? `<label class="f">À harmoniser (${unknown.length})</label>
      <div class="muted" style="margin-bottom:6px">Ces écritures de tes recettes ne sont pas dans la liste : choisis l’ingrédient qui correspond, ou ajoute-le.</div>
      ${unknown.map(u => `<div class="harm"><div class="harm-h"><b>${esc(u.name)}</b><small>dans ${u.count} recette${u.count > 1 ? 's' : ''}</small></div>
        <input type="text" class="harm-in" data-from="${esc(u.name)}" data-seed="${esc(u.name)}" placeholder="Choisir l’ingrédient correspondant…" aria-label="Ingrédient pour ${esc(u.name)}"></div>`).join('')}`
      : '<div class="ingok">✓ Tous les ingrédients de tes recettes sont dans la liste.</div>'}
    <label class="f">Ajoutés par ton foyer</label>
    ${custom.length ? `<div class="card" style="padding:4px 12px;box-shadow:none;margin:0">${custom.map(n => { const c = nUse(n); return `
      <div class="shopitem"><div class="txt">${esc(n)}<small>${c ? 'dans ' + c + ' recette' + (c > 1 ? 's' : '') : 'pas encore utilisé'}</small></div>
        ${c ? '' : `<button class="x" data-act="ingdel" data-name="${esc(n)}" aria-label="Retirer ${esc(n)} de la liste">×</button>`}</div>`; }).join('')}</div>`
      : '<div class="muted">Aucun pour l’instant. Un ingrédient absent de la liste s’ajoute depuis le formulaire d’une recette.</div>'}`;
  b.querySelectorAll('.harm-in').forEach(inp => ingAuto.attach(inp, name => {
    const from = inp.dataset.from;
    const n = ingRename(x => x === from ? name : null);
    store.save(); render();
    toast(from === name ? '« ' + name + ' » est maintenant dans la liste' : '« ' + from + ' » → « ' + name + ' » dans ' + n + ' recette' + (n > 1 ? 's' : ''));
    paintIngredients();
  }));
  /* écriture reconnue en quittant le champ (ex. ajouté entre-temps) : appliquée aussi */
  b.querySelectorAll('.harm-in').forEach(inp => inp.addEventListener('ingpicked', () => {
    const from = inp.dataset.from, name = inp.value;
    if(from !== name){ ingRename(x => x === from ? name : null); store.save(); render(); paintIngredients(); }
  }));
}
/* ---------- catégories de la liste de courses (facultatif) ----------
   state.cats     : [{ id, name }] dans l'ordre choisi (ex. celui des rayons du magasin)
   state.catOf    : { clé du produit : { c:id de la catégorie, n:nom affiché } } — retenu pour les prochaines fois
   state.shopSort : liste triée par catégorie ou non */
const LEADING_QTY = /^\s*\d+(?:[.,]\d+)?\s*(?:x\s+)?/i;
/* nom du produit d'une ligne de courses (« Farine — 250 g » → « Farine », « 2 baguettes » → « baguettes ») */
function shopName(it){
  if(it.name) return it.name;
  if(it.key) return String(it.label || '').split(' — ')[0];
  return String(it.label || '').replace(LEADING_QTY, '') || String(it.label || '');
}
const catKey = name => accentKey(ingFind(name) || name);
const catList = () => Array.isArray(state.cats) ? state.cats : [];
const catById = id => catList().find(c => c.id === id);
function catOfName(name){
  const m = (state.catOf || {})[catKey(name)];
  return m && catById(m.c) ? m.c : '';
}
/* range un produit (et tous ceux qui s'écrivent pareil) ; catId vide = sans catégorie */
function setCat(name, catId){
  const k = catKey(name); if(!k) return;
  state.catOf = Object.assign({}, state.catOf);
  if(catId) state.catOf[k] = { c:catId, n:ingFind(name) || ingTidy(name) };
  else delete state.catOf[k];
}
function addCat(name){
  name = ingTidy(name).slice(0, 40); if(!name) return null;
  const same = catList().find(c => ingKey(c.name) === ingKey(name));
  if(same) return same;
  const c = { id:uid(), name };
  state.cats = catList().concat(c);
  return c;
}
/* catégories proposées : les rayons du catalogue, avec leurs ingrédients déjà rangés */
function catDefaults(){
  ING_SECTIONS.forEach(([name, list]) => {
    const c = addCat(name);
    list.split('|').forEach(n => { if(!catOfName(n)) setCat(n, c.id); });
  });
  addCat('Droguerie et hygiène');
}
const catCount = id => Object.values(state.catOf || {}).filter(m => m && m.c === id).length;
/* produits d'une catégorie, dans l'ordre choisi (puis alphabétique pour ceux jamais déplacés) */
function catItems(id){
  return Object.entries(state.catOf || {}).filter(([, m]) => m && m.c === id)
    .map(([k, m]) => ({ k, n:m.n || k, o:typeof m.o === 'number' ? m.o : Infinity }))
    .sort((a, b) => a.o - b.o || a.n.localeCompare(b.n, 'fr'));
}
/* déplace un produit d'un cran dans sa catégorie */
function catMoveItem(id, key, dir){
  const l = catItems(id), i = l.findIndex(x => x.k === key), j = i + dir;
  if(i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  state.catOf = Object.assign({}, state.catOf);
  l.forEach((x, n) => { state.catOf[x.k] = Object.assign({}, state.catOf[x.k], { o:n }); });
}
const TRASH = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
/* ↑ ↓ ; en bout de liste, un emplacement vide plutôt qu'un bouton désactivé */
const moveBtns = (act, attrs, i, n, label) =>
  (i ? `<button class="iconbtn sm" data-act="${act}" ${attrs} data-dir="-1" aria-label="Monter ${label}">↑</button>` : '<span class="iconbtn sm off" aria-hidden="true">↑</span>') +
  (i < n - 1 ? `<button class="iconbtn sm" data-act="${act}" ${attrs} data-dir="1" aria-label="Descendre ${label}">↓</button>` : '<span class="iconbtn sm off" aria-hidden="true">↓</span>');

/* ---- ranger un produit de la liste ---- */
function openShopCat(itemId){
  const it = state.shopping.find(x => x.id === itemId); if(!it) return;
  const name = ingFind(shopName(it)) || ingTidy(shopName(it)), cur = catOfName(name);
  openModal(`
    <h2>Ranger « ${esc(name)} »</h2>
    <div class="muted" style="margin-bottom:10px">C’est retenu : « ${esc(name)} » ira toujours dans cette catégorie.</div>
    <div class="catpick">${catList().map(c => `<button class="catopt${c.id === cur ? ' on' : ''}" data-act="setcat" data-id="${it.id}" data-cat="${c.id}">${c.id === cur ? '✓ ' : ''}${esc(c.name)}</button>`).join('')}</div>
    <label class="f">Nouvelle catégorie</label>
    <div class="row" style="gap:8px"><input type="text" id="newCatName" placeholder="Ex. Surgelés" maxlength="40" autocomplete="off" style="flex:1">
      <button class="btn sm" data-act="setcatnew" data-id="${it.id}" style="flex:none">Créer et ranger</button></div>
    <div class="foot">
      ${cur ? `<button class="btn ghost" data-act="setcat" data-id="${it.id}" data-cat="">Sans catégorie</button>` : ''}
      <button class="btn ghost" data-act="closemodal">Annuler</button></div>`);
}

/* ---- écran « Catégories » : créer, renommer, ordonner, supprimer, choisir les ingrédients ---- */
function openCats(){
  const cats = catList();
  openModal(`
    <h2>Catégories</h2>
    <div class="muted">L’ordre ci-dessous est celui de ta liste de courses : mets-les dans l’ordre des rayons de ton magasin. Touche une catégorie pour choisir ses ingrédients.</div>
    ${cats.length ? `<div class="card" style="padding:4px 10px;box-shadow:none;margin:12px 0 0">${cats.map((c, i) => `
      <div class="catrow">
        <button class="catname" data-act="catopen" data-cat="${c.id}">${esc(c.name)}<small>${catCount(c.id)} ingrédient${catCount(c.id) > 1 ? 's' : ''}</small></button>
        ${moveBtns('catmove', `data-cat="${c.id}"`, i, cats.length, esc(c.name))}
      </div>`).join('')}</div>`
      : `<div class="empty" style="padding:14px">Aucune catégorie pour l’instant.</div>
         <button class="btn block" data-act="catdefaults">Partir de catégories proposées</button>
         <div class="muted" style="margin-top:6px;font-size:12.5px">Fruits et légumes, Boucherie, Crèmerie… avec les ingrédients courants déjà rangés. Tout reste modifiable.</div>`}
    <label class="f">${cats.length ? 'Ajouter une catégorie' : 'Ou crée les tiennes'}</label>
    <div class="row" style="gap:8px"><input type="text" id="catNew" placeholder="Ex. Surgelés" maxlength="40" autocomplete="off" style="flex:1">
      <button class="btn sm" data-act="catadd" style="flex:none">Ajouter</button></div>
    <div class="foot"><button class="btn ghost" data-act="closemodal">Fermer</button></div>`);
  $('#catNew').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('[data-act="catadd"]').click(); } });
}
function openCat(id, edit = false){
  const c = catById(id); if(!c){ openCats(); return; }
  const items = catItems(id);
  if(edit){
    /* mode « Modifier » : un produit par ligne, ordre et suppression faciles au doigt */
    openModal(`
      <div class="row" style="justify-content:space-between;align-items:center;gap:8px">
        <h2 style="margin:0">${esc(c.name)}</h2>
        <button class="btn sm" data-act="catopen" data-cat="${id}" style="flex:none">Terminé</button></div>
      <div class="muted" style="margin:8px 0">Change l’ordre des produits (c’est celui de ta liste de courses) ou retire-les de la catégorie.</div>
      ${items.length ? `<div class="card" style="padding:2px 10px;box-shadow:none;margin:0">${items.map((x, i) => `
        <div class="catrow">
          <span class="catitem">${esc(x.n)}</span>
          ${moveBtns('catitemmove', `data-cat="${id}" data-key="${esc(x.k)}"`, i, items.length, esc(x.n))}
          <button class="iconbtn sm trash" data-act="catunset" data-cat="${id}" data-key="${esc(x.k)}" data-edit="1" aria-label="Retirer ${esc(x.n)} de la catégorie">${TRASH}</button>
        </div>`).join('')}</div>` : '<div class="empty" style="padding:14px">Plus aucun produit dans cette catégorie.</div>'}
      <div class="foot"><button class="btn" data-act="catopen" data-cat="${id}">Terminé</button></div>`);
    return;
  }
  openModal(`
    <label class="f" style="margin-top:0">Nom de la catégorie</label>
    <input type="text" id="catName" value="${esc(c.name)}" maxlength="40" autocomplete="off">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <label class="f">Ingrédients rangés ici (${items.length})</label>
      ${items.length ? `<button class="btn line sm" data-act="catedit" data-cat="${id}" style="margin-bottom:6px">✏️ Modifier</button>` : ''}
    </div>
    ${items.length ? `<div class="catings">${items.map(x => `<span class="tag">${esc(x.n)}</span>`).join('')}</div>`
      : '<div class="muted">Aucun pour l’instant.</div>'}
    <label class="f">Ajouter un ingrédient</label>
    <input type="text" id="catIng" placeholder="Choisir un ingrédient…">
    <div class="muted" style="margin-top:5px;font-size:12.5px">Un produit ajouté à la main à la liste de courses se range depuis la liste, en le touchant.</div>
    <div class="foot">
      <button class="btn ghost" data-act="cats">‹ Catégories</button>
      <button class="btn danger" data-act="catdel" data-cat="${id}">Supprimer</button></div>`);
  $('#catName').addEventListener('change', () => {
    const v = ingTidy($('#catName').value).slice(0, 40); if(!v){ $('#catName').value = c.name; return; }
    c.name = v; state.cats = catList().slice(); store.save(); renderShop(); toast('Catégorie renommée');
  });
  const inp = $('#catIng');
  const put = name => {
    const prev = catOfName(name);
    setCat(name, id); store.save(); renderShop();
    toast('« ' + name + ' » rangé dans ' + c.name + (prev && prev !== id ? ' (au lieu de ' + catById(prev).name + ')' : ''));
    openCat(id);
  };
  ingAuto.attach(inp, put);
  inp.addEventListener('ingpicked', () => put(inp.value));
}

function ingredientRow(name='', qty='', unit='g'){
  /* une ligne déjà remplie garde son unité ; une ligne vide suit l'unité habituelle */
  return `<div class="ingline"${name ? ' data-touched="1"' : ''}>
    <input type="text" class="i-name" placeholder="Ingrédient" value="${esc(name)}">
    <input type="number" class="i-qty" min="0" step="any" inputmode="decimal" placeholder="Qté" value="${esc(qty ?? '')}">
    <select class="i-unit">${UNITS.map(u=>`<option value="${u.k}"${u.k===unit?' selected':''}>${esc(u.l)}</option>`).join('')}</select>
    <button class="x" data-act="deling" aria-label="Retirer la ligne">×</button>
  </div>`;
}

function openRecipeForm(id, opts = {}){
  const r = id ? findRecipe(id) : null;
  const existing = Array.from(new Set(state.recipes.flatMap(x=>x.tags||[]))).sort((a,b)=>a.localeCompare(b,'fr'));
  openModal(`
    <h2>${r ? 'Modifier la recette' : 'Nouvelle recette'}</h2>
    <form id="recForm" autocomplete="off">
      <label class="f">Nom de la recette</label>
      <input type="text" id="rName" required value="${r?esc(r.name):''}" placeholder="Ex. Risotto aux champignons">

      <div class="grid2b">
        <div>
          <label class="f">Durée (minutes)</label>
          <input type="number" id="rDur" min="1" step="1" required value="${r?r.duration:''}" placeholder="30">
        </div>
        <div>
          <label class="f">Pour (personnes)</label>
          <input type="number" id="rServ" min="1" step="1" inputmode="numeric" value="${r&&r.servings?r.servings:''}" placeholder="4">
        </div>
      </div>

      <label class="f">Ingrédients</label>
      <div class="muted" id="ingFor" style="margin:-2px 0 6px">${r&&r.servings ? 'Quantités pour ' + r.servings + ' personne' + (r.servings>1?'s':'') : 'Quantités pour le nombre de personnes indiqué ci-dessus'}</div>
      <div id="ingWrap">
        ${(r&&r.ingredients&&r.ingredients.length ? r.ingredients : [{name:'',qty:'',unit:'g'}]).map(i=>ingredientRow(i.name,i.qty,i.unit ?? 'g')).join('')}
      </div>
      <button type="button" class="btn ghost block" style="margin-top:8px" data-act="adding">+ Ajouter une ligne</button>

      <label class="f">Préparation <span class="opt">(facultatif)</span></label>
      <textarea id="rSteps" rows="5" placeholder="Une étape par ligne :&#10;Préchauffer le four à 180 °C&#10;Éplucher et couper les pommes&#10;…">${r&&r.steps?esc(r.steps):''}</textarea>
      <div class="muted" style="margin-top:5px">Va à la ligne pour chaque nouvelle étape : elles seront numérotées automatiquement.</div>

      <label class="f">Lien de la recette <span class="opt">(facultatif)</span></label>
      <input type="text" id="rUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" value="${r&&r.url?esc(r.url):''}" placeholder="https://www.marmiton.org/…">
      <div class="err" id="rUrlErr" style="min-height:0"></div>

      <label class="f">Étiquettes</label>
      <input type="text" id="rTags" list="tagSuggest" value="${r?esc((r.tags||[]).join(', ')):''}" placeholder="végétarien, rapide, hiver…">
      <datalist id="tagSuggest">${existing.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
      <div class="muted" style="margin-top:5px">Sépare-les par des virgules.</div>

      <div class="foot">
        <button type="button" class="btn ghost" id="rCancel">Annuler</button>
        <button type="submit" class="btn">${r?'Enregistrer':'Créer la recette'}</button>
      </div>
    </form>
  `);
  ingStats = ingredientStats();
  /* ingrédient choisi dans la liste : unité habituelle proposée (si on n'a pas choisi soi-même l'unité), puis la quantité */
  const wrap = $('#ingWrap');
  const picked = (name, input, move) => {
    const line = input.closest('.ingline'); if(!line) return;
    const u = ingStats.unit.get(ingKey(name));
    if(!line.dataset.touched && u !== undefined) line.querySelector('.i-unit').value = u;
    if(move) line.querySelector('.i-qty').focus();
  };
  const hook = input => ingAuto.attach(input, (name, inp) => picked(name, inp, true));
  wrap.querySelectorAll('.i-name').forEach(inp => { hook(inp);
    /* écriture hors liste (recettes d'avant) : signalée tout de suite */
    if(inp.value.trim() && ingFind(inp.value) !== inp.value.trim()) inp.classList.add('bad'); });
  wrap.addEventListener('ingpicked', e => picked(e.target.value, e.target, false));
  wrap.addEventListener('input', e => {                 // écriture reconnue en cours de frappe : unité proposée tout de suite
    if(!e.target.classList.contains('i-name')) return;
    const n = ingFind(e.target.value); if(n) picked(n, e.target, false);
  });
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.querySelector && n.querySelectorAll('.i-name').forEach(hook))))
    .observe(wrap, { childList:true });
  wrap.addEventListener('change', e=>{
    if(e.target.classList.contains('i-unit')) e.target.closest('.ingline').dataset.touched = '1';
  });
  $('#rServ').addEventListener('input', ()=>{
    const n = parseInt($('#rServ').value, 10);
    $('#ingFor').textContent = n > 0 ? 'Quantités pour ' + n + ' personne' + (n>1?'s':'') : 'Quantités pour le nombre de personnes indiqué ci-dessus';
  });
  /* Annuler : retour à la liste du créneau si on venait du calendrier */
  $('#rCancel').addEventListener('click', ()=> opts.plan ? openPicker(opts.plan.dateKey, opts.plan.slot) : closeModal());
  if(!r && opts.name) $('#rName').value = opts.name;
  const form = $('#recForm');
  form.addEventListener('submit', ev=>{
    ev.preventDefault();
    const name = $('#rName').value.trim();
    const duration = parseInt($('#rDur').value,10);
    const servings = parseInt($('#rServ').value,10) > 0 ? parseInt($('#rServ').value,10) : null;
    if(!name){ toast('Le nom est obligatoire'); return; }
    if(!(duration > 0)){ toast('La durée doit être un nombre entier positif'); return; }
    const url = safeUrl($('#rUrl').value);
    if(url === null){ $('#rUrlErr').textContent = 'Ce lien ne semble pas valide (ex. https://www.marmiton.org/…).'; $('#rUrl').focus(); return; }
    /* chaque ingrédient doit venir de la liste */
    const bad = Array.from($$('#ingWrap .i-name')).filter(inp => {
      const v = inp.value.trim(); if(!v) return false;
      const k = ingFind(v); if(k){ inp.value = k; inp.classList.remove('bad'); return false; }
      inp.classList.add('bad'); return true;
    });
    if(bad.length){ toast('Choisis chaque ingrédient dans la liste (ou ajoute-le)'); bad[0].focus(); return; }
    const ingredients = Array.from($$('#ingWrap .ingline')).map(line=>{
      const n = line.querySelector('.i-name').value.trim();
      const q = parseFloat(String(line.querySelector('.i-qty').value).replace(',', '.'));
      const u = line.querySelector('.i-unit').value;
      return n ? { name:n, qty: (q>0 ? q : ''), unit:u } : null;     // quantité vide = « selon le goût »
    }).filter(Boolean);
    const tags = $('#rTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const uniqTags = Array.from(new Set(tags));
    const steps = $('#rSteps').value.replace(/\s+$/, '');

    if(r){
      Object.assign(r, { name, duration, servings, url, ingredients, steps, tags:uniqTags });
    } else {
      state.recipes.push({ id:uid(), name, duration, servings, url, ingredients, steps, tags:uniqTags });
    }
    /* créée depuis « + Ajouter une recette » du calendrier : on la met au menu */
    const to = !r && opts.plan;
    if(to && !isPastKey(to.dateKey)){
      const newId = state.recipes[state.recipes.length - 1].id;
      const day = state.plan[to.dateKey] = state.plan[to.dateKey] || { midi:[], soir:[] };
      day[to.slot] = day[to.slot] || [];
      day[to.slot].push({ id:newId, who:'' });
    }
    store.save(); render(); closeModal();
    toast(r ? 'Recette mise à jour' : to ? 'Recette créée et ajoutée au ' + DAYS[weekdayOf(to.dateKey)].toLowerCase() + ' ' + to.slot : 'Recette ajoutée');
  });
}

/* ---- choisir un créneau pour planifier une recette ---- */
function openSlotPicker(recipeId){
  /* jamais de jour passé. Semaine future affichée : cette semaine-là en entier.
     Sinon : la fin de la semaine en cours + toute la semaine suivante
     (sans ça, un dimanche on ne pouvait plus choisir qu'un seul jour) */
  const today = new Date(); today.setHours(0,0,0,0);
  const shown = weekDates(ANCHOR);
  const dates = shown[0] > today
    ? shown
    : weekDates(today).concat(weekDates(addDays(today, 7))).filter(d => !isPastKey(isoOf(d)));
  let lastWeek = null;
  openModal(`
    <h2>Planifier cette recette</h2>
    <div class="muted" style="margin-bottom:4px">Choisis le jour et le moment.</div>
    ${dates.map(d=>{
      const key = isoOf(d);
      /* titre à chaque nouvelle semaine */
      const w = isoWeek(d).week;
      const head = w !== lastWeek
        ? `<div class="slotweek">Semaine ${w}${w === isoWeek(today).week ? ' · cette semaine' : (w === isoWeek(addDays(today, 7)).week ? ' · semaine prochaine' : '')}</div>` : '';
      lastWeek = w;
      /* créneaux où cette recette est déjà au menu */
      const done = SLOTS.filter(s => ((state.plan[key] || {})[s.k] || []).some(e => eidOf(e) === recipeId));
      /* tous les plats déjà prévus ce jour-là (toutes recettes confondues) */
      const dayNames = recipesOfDay(key).map(e => findRecipe(eidOf(e))).filter(Boolean).map(x => x.name);
      const n = dayNames.length;
      const open = SLOTS.filter(s => !slotOff(key, s.k));          // créneaux affichés ce jour-là
      return head + `<div class="card slotday${done.length ? ' has' : ''}" style="margin-bottom:9px;box-shadow:none">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <span class="slotday-h"><b style="font-size:14.5px">${DAYS[(d.getDay()+6)%7]} ${fmtDate(d)}</b>
            <span class="daycount${n ? '' : ' none'}" title="${esc(dayNames.join(', '))}">${n ? '🍽 ' + n + ' plat' + (n>1?'s':'') : 'rien de prévu'}</span></span>
          ${done.length ? `<span class="pill">✓ déjà prévue ${done.map(s=>s.l.toLowerCase()).join(' et ')}</span>` : ''}
        </div>
        <div class="row">
          ${!open.length ? '<span class="muted">Pas de repas prévu ce jour-là</span>' : open.map(s => done.includes(s)
            ? `<span class="btn sm slot-done" style="flex:1" aria-label="${s.l} : déjà prévue">✓ ${s.l}</span>`
            : `<button class="btn ghost sm" style="flex:1" data-act="doplan" data-id="${recipeId}" data-date="${key}" data-slot="${s.k}">${s.l}</button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    <div class="foot"><button class="btn ghost" data-act="closemodal">Annuler</button></div>
  `);
}

/* ---- « Tous les mercredis ? » : posée la première fois qu'on coche / décoche un repas ---- */

  const wd = weekdayOf(key), jour = DAYS[wd].toLowerCase(), repas = slot === 'midi' ? 'le midi' : 'le soir';
  const d = new Date(key + 'T12:00:00');
  openModal(`

    <button class="btn block" data-act="mealscope" data-scope="all" data-date="${key}" data-slot="${slot}" data-want="${want?1:0}">Tous les ${jour}s</button>
    <button class="btn ghost block" style="margin-top:9px" data-act="mealscope" data-scope="day" data-date="${key}" data-slot="${slot}" data-want="${want?1:0}">Seulement ce ${jour} ${fmtDate(d)}</button>

}

/* ---- import courses ---- */
function doImport(mode){
  const v = $('#impWeek').value; if(!v) return;
  const [y,w] = v.split('-').map(Number);
  const { chosen, groups, keys } = weekIngredients(y, w);
  if(!chosen.length || !keys.length){ toast('Aucun ingrédient à importer'); return; }

  const items = keys.map(k=>({
    id: uid(),
    label: groups[k].name + (groups[k].qty ? ' — ' + qtyLabel(groups[k].qty, groups[k].unit) : ''),
    name: groups[k].name,
    key: k,
    src: 'Semaine ' + w + ' · ' + Array.from(groups[k].src).join(', '),
    done: false
  }));

  if(mode === 'replace'){
    state.shopping = items;
  } else {
    const known = new Set(state.shopping.filter(i=>!i.done && i.key).map(i=>i.key));
    const fresh = items.filter(i=>!known.has(i.key));
    state.shopping = state.shopping.concat(fresh);
    if(!fresh.length) toast('Tous ces produits sont déjà dans la liste');
    else toast(fresh.length + ' produit' + (fresh.length>1?'s':'') + ' ajouté' + (fresh.length>1?'s':''));
  }
  store.save(); render();
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  const id  = t.dataset.id;

  switch(act){
    case 'unplan': {
      const day = state.plan[t.dataset.date];
      if(day){
        const list = day[t.dataset.slot] || [];
        const pos = list.findIndex(e => eidOf(e) === id);
        if(pos >= 0) list.splice(pos, 1);
      }
      store.save(); render(); break;
    }
    case 'plan':    openPicker(t.dataset.date, t.dataset.slot); break;
    case 'slotsw': {                              // coche « Midi » / « Soir » d'un jour
      const key = t.dataset.date, slot = t.dataset.slot;
      if(isPastKey(key)) break;
      const want = slotOff(key, slot);              // true = on veut l'afficher
      const n = ((state.plan[key] || {})[slot] || []).length;
      if(!want && n){ toast('Retire d’abord ' + (n>1 ? 'les ' + n + ' plats' : 'le plat') + ' du ' + slot + ' pour masquer ce créneau'); break; }
      const wd = weekdayOf(key);
      if(want === !defaultOff(wd, slot)){ setDayShow(key, slot, null); store.save(); renderWeek(); break; }   // retour au réglage habituel
      if((state.mealAsked || []).includes(wd + '-' + slot)){ setDayShow(key, slot, want); store.save(); renderWeek(); break; }
      askMealScope(key, slot, want);              // première fois : ce jour seulement, ou tous les X ?
      break;
    }
    case 'mealscope': {
      const key = t.dataset.date, slot = t.dataset.slot, want = t.dataset.want === '1', wd = weekdayOf(key);
      if(t.dataset.scope === 'all'){ setDefaultOff(wd, slot, !want); setDayShow(key, slot, null); }
      else setDayShow(key, slot, want);
      markAsked(wd, slot);
      store.save(); closeModal(); renderWeek();
      toast(t.dataset.scope === 'all' ? 'Réglage appliqué à tous les ' + DAYS[wd].toLowerCase() + 's' : 'Réglage appliqué à ce jour seulement');
      break;
    }
    case 'mealdef': {                             // écran « Repas affichés »
      const wd = Number(t.dataset.wd), slot = t.dataset.slot;
      setDefaultOff(wd, slot, !defaultOff(wd, slot)); markAsked(wd, slot);
      store.save(); renderWeek(); openMealSettings();
      break;
    }
    case 'mealreset': {
      const today = isoOf(new Date());
      Object.keys(state.plan).forEach(k => { if(k >= today && state.plan[k].show) delete state.plan[k].show; });
      store.save(); renderWeek(); openMealSettings(); toast('Les jours à venir suivent de nouveau le réglage habituel');
      break;
    }
    case 'doplan': {
      const key = t.dataset.date;
      const slot = t.dataset.slot || (pickerCtx && pickerCtx.slot);
      const date = key || (pickerCtx && pickerCtx.dateKey);
      if(!date || isPastKey(date)){ closeModal(); toast('Ce jour est passé : impossible d’y ajouter une recette'); break; }
      state.plan[date] = state.plan[date] || { midi:[], soir:[] };
      state.plan[date].midi = state.plan[date].midi || [];
      state.plan[date].soir = state.plan[date].soir || [];
      state.plan[date][slot] = state.plan[date][slot] || [];
      if(!state.plan[date][slot].some(e => eidOf(e) === id)) state.plan[date][slot].push({ id, who:'' });
      store.save(); closeModal(); render();
      toast('Plat ajouté au calendrier');
      break;
    }
    case 'openrec': openRecipe(id); break;
    case 'editrec': openRecipeForm(id); break;
    case 'planfrom': openSlotPicker(id); break;
    case 'delrec': {
      const rr = findRecipe(id);
      if(!confirm('Supprimer « ' + (rr ? rr.name : 'cette recette') + ' » ? Elle sera aussi retirée du calendrier.')) break;
      state.recipes = state.recipes.filter(r=>r.id!==id);
      Object.keys(state.plan).forEach(k=>{
        SLOTS.forEach(s=>{
          if(state.plan[k][s.k]) state.plan[k][s.k] = state.plan[k][s.k].filter(x=>eidOf(x)!==id);
        });
      });
      store.save(); closeModal(); render(); toast('Recette supprimée');
      break;
    }
    case 'adding': $('#ingWrap').insertAdjacentHTML('beforeend', ingredientRow()); $('#ingWrap .ingline:last-child .i-name').focus(); break;
    case 'ingredients': closeMenu(); openIngredients(); break;
    case 'shopsort':
      state.shopSort = !state.shopSort; store.save(); renderShop();
      if(state.shopSort && !catList().length) openCats();
      break;
    case 'cats': openCats(); break;
    case 'catdefaults': catDefaults(); store.save(); renderShop(); openCats(); toast('Catégories proposées ajoutées'); break;
    case 'catadd': {
      const v = $('#catNew').value; if(!ingTidy(v)) break;
      const n = catList().length, c = addCat(v); store.save(); renderShop();
      if(catList().length === n) toast('« ' + c.name + ' » existe déjà');
      openCats(); break;
    }
    case 'catmove': {
      const l = catList().slice(), i = l.findIndex(c => c.id === t.dataset.cat), j = i + Number(t.dataset.dir);
      if(i < 0 || j < 0 || j >= l.length) break;
      [l[i], l[j]] = [l[j], l[i]]; state.cats = l; store.save(); renderShop(); openCats(); break;
    }
    case 'catopen': openCat(t.dataset.cat); break;
    case 'catunset': {
      state.catOf = Object.assign({}, state.catOf); delete state.catOf[t.dataset.key];
      store.save(); renderShop(); openCat(t.dataset.cat, !!t.dataset.edit); break;
    }
    case 'catedit': openCat(t.dataset.cat, true); break;
    case 'catitemmove': catMoveItem(t.dataset.cat, t.dataset.key, Number(t.dataset.dir)); store.save(); renderShop(); openCat(t.dataset.cat, true); break;
    case 'catdel': {
      const c = catById(t.dataset.cat); if(!c) break;
      const n = catCount(c.id);
      if(!confirm('Supprimer la catégorie « ' + c.name + ' » ?' + (n ? '\n' + n + ' ingrédient' + (n > 1 ? 's' : '') + ' redeviendr' + (n > 1 ? 'ont' : 'a') + ' « sans catégorie ».' : ''))) break;
      state.cats = catList().filter(x => x.id !== c.id);
      state.catOf = Object.fromEntries(Object.entries(state.catOf || {}).filter(([, m]) => !m || m.c !== c.id));
      store.save(); renderShop(); openCats(); toast('Catégorie supprimée'); break;
    }
    case 'shopcat': openShopCat(id); break;
    case 'setcat': case 'setcatnew': {
      const it = state.shopping.find(x => x.id === id); if(!it) break;
      let cat = t.dataset.cat || '';
      if(act === 'setcatnew'){ const c = addCat($('#newCatName').value); if(!c){ toast('Donne un nom à la catégorie'); break; } cat = c.id; }
      setCat(shopName(it), cat); store.save(); renderShop(); closeModal();
      toast(cat ? '« ' + (ingFind(shopName(it)) || ingTidy(shopName(it))) + ' » rangé dans ' + catById(cat).name : 'Retiré de sa catégorie');
      break;
    }
    case 'ingdel': {
      const n = t.dataset.name;
      state.ingredients = (state.ingredients || []).filter(x => x !== n);
      store.save(); paintIngredients(); toast('« ' + n + ' » retiré de la liste'); break;
    }
    case 'deling': t.closest('.ingline').remove(); break;
    case 'ftag': filterTag = t.dataset.tag || null; renderRecipes(); break;
    case 'ftagall': filterTag = t.dataset.tag || null; closeModal(); renderRecipes(); window.scrollTo({ top:0 }); break;
    case 'closemodal': closeModal(); break;
    case 'ck': {
      const it = state.shopping.find(x=>x.id===id);
      if(it){ it.done = !it.done; store.save(); renderShop(); }
      break;
    }
    case 'delitem': state.shopping = state.shopping.filter(x=>x.id!==id); store.save(); renderShop(); break;
    case 'import': doImport(t.dataset.mode); break;
    case 'friends': openFriends(); break;
    case 'pseudo': openPseudo(false); break;
    case 'fraccept': case 'frrefuse': case 'frremove': friendAction(t); break;
    case 'frrec': openFriendRecipe(Number(t.dataset.i)); break;
    case 'frback': openFriendRecipes(); break;
    case 'frimport': {
      const x = frCache && frCache[Number(t.dataset.i)];
      if(!x || importedFrom(x.ami, x.r.id)) break;
      state.recipes.push(cleanFriendRecipe(x.r, x.ami));
      store.save(); render();
      toast('« ' + x.r.name + ' » ajoutée à tes recettes');
      openFriendRecipe(Number(t.dataset.i));
      break;
    }
    case 'imptoggle': impOff.has(id) ? impOff.delete(id) : impOff.add(id); renderImport(); break;
    case 'localonly': localStorage.setItem(LS_LOCALONLY,'1'); closeModal(); toast('Données gardées sur cet appareil'); break;
    case 'relogin': openLogin(t.dataset.email); break;
    case 'logout': closeMenu(); doLogout(); break;
    case 'switchfoyer': closeMenu(); switchFoyer(t.dataset.foyer); break;
    case 'newfoyer': closeMenu(); openCreateFoyer(); break;
    case 'foyer': openFoyer(); break;
    case 'refoyer': cloud.start().then(()=>{ if(cloud.foyer) openFoyer(); }); break;
    case 'delmembre': {
      const mail = t.dataset.email;
      if(!confirm('Retirer ' + mail + ' du foyer ?')) break;
      db('foyer_membres?foyer_id=eq.' + encodeURIComponent(cloud.foyer) + '&email=eq.' + encodeURIComponent(mail), { method:'DELETE' })
        .then(()=>{ toast('Membre retiré'); openFoyer(); })
        .catch(err=>toast('Impossible : ' + err.message));
      break;
    }
  }
});

/* --- semaine --- */
$('#prevW').addEventListener('click', ()=> changeWeek(-1));
$('#nextW').addEventListener('click', ()=> changeWeek(1));

/* ---- changer de semaine, avec un petit glissement ----
   from : côté d'où arrive la nouvelle semaine (+1 = de la droite, -1 = de la gauche) */
function changeWeek(delta, from = delta){
  ANCHOR = addDays(ANCHOR, 7 * delta);
  render();
  const wd = $('#weekDays');
  wd.classList.remove('wk-in'); wd.style.transform = ''; wd.style.opacity = '';
  wd.style.setProperty('--wk-from', (from > 0 ? 40 : -40) + 'px');
  void wd.offsetWidth; wd.classList.add('wk-in');
  /* semaine en cours : sur le jour actuel ; sinon en haut de la semaine */
  if(isoWeek(ANCHOR).week === isoWeek(new Date()).week && isoWeek(ANCHOR).year === isoWeek(new Date()).year) scrollToToday();
  else if(window.scrollY > $('#v-cal').offsetTop) window.scrollTo({ top:0 });
}

/* ---- glisser le doigt sur les jours pour changer de semaine ----
   comme on tourne une page : vers la gauche = semaine suivante,
   vers la droite = semaine précédente (pour inverser, passer SWIPE_NEXT à 1) */
const SWIPE_NEXT = -1;
(function(){
  const wd = $('#weekDays');
  let x0 = 0, y0 = 0, dx = 0, mode = '', vx = 0, lastX = 0, lastT = 0;
  wd.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1){ mode = 'no'; return; }
    x0 = lastX = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; vx = 0; lastT = Date.now(); mode = '';
  }, { passive:true });
  wd.addEventListener('touchmove', e=>{
    if(mode === 'no' || mode === 'v' || e.touches.length !== 1) return;
    const t = e.touches[0]; dx = t.clientX - x0; const dy = t.clientY - y0;
    if(mode === ''){
      if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      /* nettement horizontal : on change de semaine ; sinon on laisse défiler la page */
      mode = Math.abs(dx) > Math.abs(dy) * 1.4 ? 'h' : 'v';
      if(mode === 'v') return;
      wd.classList.remove('wk-in'); wd.classList.add('wk-drag');
    }
    e.preventDefault();
    const now = Date.now(); if(now > lastT){ vx = (t.clientX - lastX) / (now - lastT); lastX = t.clientX; lastT = now; }
    wd.style.transform = 'translateX(' + (dx * 0.6) + 'px)';
    wd.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 600));
  }, { passive:false });
  const end = ()=>{
    if(mode !== 'h'){ mode = ''; return; }
    mode = '';
    wd.classList.remove('wk-drag');
    const dir = Math.sign(dx);
    if(Math.abs(dx) > 70 || (Math.abs(dx) > 30 && Math.abs(vx) > 0.5)){
      /* la semaine part du côté du doigt, la nouvelle arrive de l'autre côté */
      changeWeek(dir * SWIPE_NEXT, -dir);
    } else {
      wd.classList.add('wk-back'); wd.style.transform = ''; wd.style.opacity = '';
      setTimeout(()=> wd.classList.remove('wk-back'), 220);
    }
  };
  wd.addEventListener('touchend', end);
  wd.addEventListener('touchcancel', end);
})();

/* ============================================================
   TIRER POUR ACTUALISER
   ------------------------------------------------------------
   En haut de la page, tirer vers le bas récupère les dernières
   modifications des autres membres du foyer.
   ============================================================ */
const ptr = {
  y0: 0, x0: 0, d: 0, mode: '', busy: false, THRESHOLD: 64,
  el: $('#ptr'), main: document.querySelector('main'),
  show(d){
    this.main.style.transform = d ? 'translateY(' + d + 'px)' : '';
    this.el.style.height = d + 'px';
    const ready = d >= this.THRESHOLD;
    this.el.classList.toggle('ready', ready && !this.busy);
    if(!this.busy) this.el.querySelector('.ptr-t').textContent = ready ? 'Relâche pour actualiser' : 'Tire pour actualiser';
  },
  settle(d){
    this.main.classList.add('ptr-back'); this.show(d);
    setTimeout(()=> this.main.classList.remove('ptr-back'), 260);
  },
  async refresh(){
    this.busy = true; this.el.classList.add('busy'); this.el.classList.remove('ready');
    this.el.querySelector('.ptr-t').textContent = 'Actualisation…';
    this.settle(56);
    const t0 = Date.now();
    let msg;
    try{
      if(cloud.on){
        if(cloud.pending && !(await cloud.flush())) throw new Error('hors ligne');
        await cloud.pull();
        msg = 'À jour ✓';
      } else if(auth.session){
        await cloud.start();
        msg = cloud.on ? 'À jour ✓' : 'Synchronisation indisponible';
      } else {
        render();
        msg = 'Données locales : connecte-toi pour partager avec ton foyer';
      }
    }catch(e){ msg = 'Actualisation impossible (hors ligne ?)'; }
    friends.load(true);                                    // nouvelles demandes d'amis
    updater.check(true);                                   // nouvelle version de l'app, au passage
    await new Promise(r => setTimeout(r, Math.max(0, 450 - (Date.now() - t0))));   // le temps de voir l'animation
    this.busy = false; this.el.classList.remove('busy');
    this.settle(0);
    toast(msg);
  }
};
document.addEventListener('touchstart', e=>{
  ptr.mode = '';
  if(ptr.busy || e.touches.length !== 1 || window.scrollY > 0 || $('#modal').classList.contains('on')){ ptr.mode = 'no'; return; }
  ptr.y0 = e.touches[0].clientY; ptr.x0 = e.touches[0].clientX; ptr.d = 0;
}, { passive:true });
document.addEventListener('touchmove', e=>{
  if(ptr.mode === 'no' || ptr.mode === 'x' || e.touches.length !== 1) return;
  const t = e.touches[0], dy = t.clientY - ptr.y0, dx = t.clientX - ptr.x0;
  if(ptr.mode === ''){
    if(Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
    /* seulement vers le bas, bien vertical, et depuis le tout haut de la page */
    ptr.mode = (dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.3 && window.scrollY <= 0) ? 'pull' : 'x';
    if(ptr.mode === 'x') return;
  }
  e.preventDefault();
  ptr.d = Math.min(110, Math.max(0, dy) * 0.5);          // résistance, comme un élastique
  ptr.show(ptr.d);
}, { passive:false });
const ptrEnd = ()=>{
  if(ptr.mode !== 'pull'){ ptr.mode = ''; return; }
  ptr.mode = '';
  if(ptr.d >= ptr.THRESHOLD) ptr.refresh(); else ptr.settle(0);
};
document.addEventListener('touchend', ptrEnd);
document.addEventListener('touchcancel', ptrEnd);

/* ============================================================
   MISES À JOUR
   ------------------------------------------------------------
   GitHub Pages laisse les navigateurs garder la page en cache
   ~10 min, et sur iPhone l'app de l'écran d'accueil est souvent
   « réveillée » sans être rechargée. On compare donc notre propre
   code à celui publié ; s'il a changé, on recharge l'app.
   ============================================================ */
const updater = {
  last: 0, busy: false,
  codeOf(doc){ return Array.from(doc.querySelectorAll('script:not([src]), style')).map(e => e.textContent).join('\n§\n'); },
  mine: null,
  async check(force){
    if(this.busy || location.protocol === 'file:') return;
    if(!force && Date.now() - this.last < 60*1000) return;      // au plus une fois par minute
    this.busy = true; this.last = Date.now();
    try{
      /* « reload » : va chercher la page sur le serveur et remplace la copie en cache */
      const r = await fetch(location.pathname, { cache:'reload' });
      if(!r.ok) return;
      const theirs = this.codeOf(new DOMParser().parseFromString(await r.text(), 'text/html'));
      if(theirs && theirs !== this.mine) this.ready();
    }catch(e){ /* hors ligne : on réessaiera plus tard */ }
    finally{ this.busy = false; }
  },
  ready(){
    /* rien d'ouvert à l'écran et pas de rechargement récent : mise à jour directe */
    let recent = 0; try{ recent = Number(sessionStorage.getItem('mesrecettes.maj')) || 0; }catch(e){}
    if(!$('#modal').classList.contains('on') && Date.now() - recent > 2*60*1000) this.apply();
    else $('#majBar').hidden = false;
  },
  async apply(){
    $('#majBar').hidden = true; toast('Mise à jour de l’app…');
    try{ sessionStorage.setItem('mesrecettes.maj', String(Date.now())); }catch(e){}
    if(cloud.on && cloud.pending) await cloud.flush();          // rien ne se perd
    /* adresse unique : contourne toute copie en cache de l'ancienne version */
    location.replace(location.pathname + '?maj=' + Date.now() + location.hash);
  }
};
updater.mine = updater.codeOf(document);
$('#majGo').addEventListener('click', ()=> updater.apply());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') updater.check(); });
/* on retire le ?maj=… de l'adresse après le rechargement */
if(new URLSearchParams(location.search).has('maj')) history.replaceState(null, '', location.pathname + location.hash);

/* --- démarrage --- */

migrer();

/* les polices et les données du foyer peuvent décaler la page : on se recale tant que personne n'a défilé */
const recaler = () => { weekBar.measure(); if(!userScrolled) scrollToToday(); };
if(document.fonts) document.fonts.ready.then(recaler);
initCloud().then(recaler);
setTimeout(()=> updater.check(true), 1500);         // nouvelle version publiée depuis la dernière ouverture ?
</script>
